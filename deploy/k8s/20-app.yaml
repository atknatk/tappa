# Tappa — the server (M8-02).
---
apiVersion: v1
kind: Service
metadata:
  name: tappa
  namespace: tappa
  labels:
    app.kubernetes.io/name: tappa
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tappa
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tappa
  namespace: tappa
  labels:
    app.kubernetes.io/name: tappa
    app.kubernetes.io/component: server
spec:
  # 🔴 ONE REPLICA, AND IT IS A MEASURED DECISION RATHER THAN A DEFAULT.
  #
  # internal/domain/legal states the invariant in its own package doc: the published
  # legal texts (privacy policy, terms, imprint, cookie notice) are served from an
  # IN-PROCESS snapshot, refreshed at boot and again by the process that publishes.
  # "A SECOND process would serve the previous text until it restarted. Tappa
  # deploys to ONE VPS (CLAUDE.md §1) so there is one process today; a second one
  # makes this wrong." Two steady-state replicas would therefore serve two different
  # privacy policies from the same hostname, indefinitely, with nothing reporting it
  # — on a product sold on its GDPR posture.
  #
  # Everything else in the process is already safe to run more than once: sessions
  # are database-backed, and the debounce guardrail is enforced by a per-person
  # advisory lock inside one transaction (ADR 0006), not by process memory. The
  # snapshot is the single obstacle, and internal/domain/legal names the fix — a
  # Refresh on a timer. Until that exists, this is 1.
  #
  # ⚠️ THE ROLLOUT WINDOW IS THE ONE MOMENT TWO PROCESSES EXIST, and it is bounded
  # and self-correcting: the new pod boots with a FRESH snapshot and the old one is
  # gone seconds later. The failure above needs a long-lived second reader.
  #
  # ⚠️ WHAT ONE REPLICA COSTS, stated: a pod that dies is a full outage until it is
  # rescheduled. On a single-node cluster that is true of two replicas as well.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 🔴 THIS PAIR IS WHAT MAKES M8-02's "kesintisiz deploy" TRUE, and the card
      # explains why it matters more here than for most products: KM Pastry & Bakery
      # taps in at 04:00 and Meat Production at 05:00. If the server is down the tap
      # page does not load at all — the offline queue (M9-01) cannot even engage, so
      # §4.6 ("kayıt asla kaybolmaz") goes unhonoured at the infrastructure layer.
      # maxUnavailable: 0 means the old pod keeps serving until the new one has
      # passed its readiness probe, i.e. until it has proved it can reach the
      # database.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: tappa
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tappa
        app.kubernetes.io/component: server
    spec:
      # Longer than the server's own 20 s shutdown drain (cmd/tappa: "a dropped
      # request is a lost attendance record"), so the kubelet never SIGKILLs a pod
      # that is still finishing a tap.
      terminationGracePeriodSeconds: 30
      # No pod here calls the Kubernetes API. Mounting a ServiceAccount token
      # anyway hands any code that runs in this pod a cluster credential it has
      # no use for -- the smallest hardening still on the table (audit B10).
      automountServiceAccountToken: false
      # 🔴 THERE IS NO imagePullSecrets HERE ANY MORE, AND ITS ABSENCE IS THE FIX FOR
      # BACKLOG T43 RATHER THAN A TIDY-UP (M8-02 FAZ D, 2026-08-16).
      #
      # WHAT USED TO STAND HERE. The image was private, so the kubelet needed a
      # credential; .github/workflows/deploy.yml wrote `secret/ghcr` on every run from
      # that job's own GITHUB_TOKEN, and that token is revoked when the job ends.
      #
      # 🔴 WHY THAT COULD NOT BE MADE TO WORK, MEASURED 2026-08-16. This node's kubelet
      # reports
      #     imagePullCredentialsVerificationPolicy: NeverVerifyPreloadedImages
      # (`kubectl get --raw /api/v1/nodes/<node>/proxy/configz`), which is KEP-2535, on
      # by default from 1.35. Under it an image the kubelet pulled WITH a credential is
      # only usable by a pod that presents a credential already recorded as having
      # pulled it; to anyone else the kubelet behaves as though the image is not on the
      # node at all. Three probes, same node, same tag the live pod was running:
      #     no imagePullSecret at all        -> Pulling ... 401 Unauthorized
      #     an imagePullSecret it never used -> Pulling ... 401 Unauthorized
      #     imagePullPolicy: Never           -> ErrImageNeverPull, "not present"
      # and the control that separates cache from credential: postgres:17-alpine,
      # PUBLIC and pulled anonymously, with imagePullPolicy: Never -> started from the
      # node's cache and exited 0.
      #
      # 🔴 THAT CONTROL IS THE WHOLE ARGUMENT FOR THIS CHANGE, AND IT IS STATED AS A
      # MECHANISM RATHER THAN AS A FACT ABOUT TODAY — a sentence about the world goes
      # stale in a file nobody re-reads, and this repository has now paid for that
      # eleven times. So, conditionally:
      #
      #   WHILE a pod's image was pulled WITH a credential (a private repository, an
      #   imagePullSecrets entry), the kubelet's recorded-credential check applies:
      #   a restart after the Secret has been rewritten re-pulls with a dead token,
      #   and `kubectl rollout undo` to an older ReplicaSet hits the same wall at the
      #   exact moment an operator needs it.
      #
      #   ONCE the same pod's image is pulled ANONYMOUSLY (a public repository, no
      #   imagePullSecrets), there is no credential to record, so none of that can
      #   happen: restarts and rollbacks reuse the node's copy.
      #
      # 🔴 WHICH OF THE TWO APPLIES IS A PROPERTY OF THE RUNNING CLUSTER, NOT OF THIS
      # FILE, AND THIS FILE DELIBERATELY DOES NOT ANSWER IT. The single record of
      # today's state — with the command that measures it — is deploy/README.md, under
      # "Elle deploy / rollback" and in the accepted limit
      # "[Docker Hub anonim çekme bütçesi]". Read it before you roll back. Keeping the
      # answer in ONE FILE is what makes a later transition tractable. ⚠️ Stated
      # honestly rather than generously: it is one FILE, not one spot — deploy/README.md
      # repeats today's cluster state in six regions, and each of the six carries its
      # own lapse condition, so none of them can go stale silently.
      #
      # What this manifest DOES assert, because it is about this file rather than the
      # cluster: it declares no imagePullSecrets, so a pod born from THIS spec pulls
      # anonymously. Also true of the file: the deploy no longer deletes pods to work
      # around a kubelet backoff, and there is one fewer path in this repository that
      # creates a Secret (CLAUDE.md §4.7).
      #
      # ⚠️ WHAT IS TRADED FOR IT, COUNTED. ONCE the repository is public the image is
      # downloadable by anyone. It is a
      # `scratch` image with exactly two files (the static binary and a CA bundle) and
      # deploy.yml gates its contents before push, but "public" is a decision and it is
      # written here rather than implied. And anonymous Docker Hub pulls are rate
      # limited — measured from this network as `x-ratelimit-limit: 100;w=3600` — a
      # budget the product images now share with postgres:17-alpine.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # 🔴 THE SAME WAIT AS THE MIGRATION JOB, FOR A MEASURED REASON RATHER THAN
      # SYMMETRY. cmd/tappa dials the database before it serves anything and EXITS
      # if the dial fails (internal/db.New pings; main returns the error). A pod born
      # under 12-networkpolicy.yaml loses that dial, because k3s programs a new pod's
      # address into the policy's allow-set asynchronously and the process is already
      # dialling — see 30-migrate-job.yaml for the full measurement.
      #
      # WITHOUT THIS initContainer THE DEPLOYMENT STILL RECOVERS, and that was
      # measured rather than assumed: a fresh server pod under the policy failed its
      # first dial, exited, restarted IN PLACE keeping the same address, connected,
      # and reported Ready — restartCount 1, `rollout status` succeeded, and
      # maxUnavailable: 0 meant the old pod served throughout. So this is NOT fixing
      # an outage.
      #
      # ⚠️ WHAT THAT FIRST CONTAINER ACTUALLY WRITES, so an operator can grep for it:
      # cmd/tappa logs through slog and the dial error is wrapped, so the line reads
      #   level=ERROR msg=fatal err="db: ping: ... connect: connection refused"
      # (internal/db/pool.go wraps it as "db: ping: %w"; cmd/tappa/main.go logs it as
      # msg=fatal). There is no "db: ping failed" string anywhere in the tree — an
      # earlier revision of this comment invented one, which would have sent an
      # operator grepping for a phrase that does not exist.
      #
      # What it fixes is a FALSE SYMPTOM. That first container leaves a crash and a
      # "cannot reach the database" line in the log of a deployment that is in fact
      # healthy, at 04:00, on the product whose whole failure story is a shift that
      # cannot load the tap page. deploy/README.md's incident section would otherwise
      # have to teach an operator to ignore a database error — and an operator who
      # has learned to ignore that line will ignore the real one too.
      #
      # ⚠️ WHAT IT COSTS, COUNTED HONESTLY — AND ONE PART OF IT IS THIS REPOSITORY'S
      # OWN NAMED DEFECT CLASS. This pod now needs postgres:17-alpine as well as its
      # own image, and that reference is a MOVING TAG combined with
      # imagePullPolicy: IfNotPresent — exactly the pairing the note further down
      # refuses for the product image, on the grounds that it is how a node silently
      # keeps serving last week's copy. It is written here rather than quietly
      # accepted, and deploy/README.md counts it in the accepted-limits list.
      #
      # WHY IT IS TOLERATED HERE, IN THREE MEASURED PIECES:
      #  1. The blast radius is a health probe. This container runs pg_isready and
      #     nothing else; an older cached copy resolves a name and opens a socket
      #     exactly like a newer one. The defect class bites when a STALE BINARY
      #     SERVES USERS, and nothing here serves anyone.
      #  2. It adds no dependency this namespace did not already have.
      #     10-postgres.yaml runs this same tag, so on this one-node cluster the
      #     image is present whenever the database is. If it could not be fetched,
      #     there would be no database for this pod to wait for.
      #  3. Digest pinning was considered and rejected, not overlooked. The index
      #     digest was measured (registry-1.docker.io, 17-alpine ->
      #     sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73),
      #     so it was available. Pinning only these two initContainers would put TWO
      #     spellings of one image in this directory while 10-postgres.yaml keeps the
      #     tag it deliberately shares with docker-compose.yml, and it would not fix
      #     the channel that actually matters: Docker Hub's anonymous budget, MEASURED
      #     from this network as `x-ratelimit-limit: 100;w=3600`. A digest pull spends
      #     that budget too.
      # The wait itself cost about a second on a healthy cluster.
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          # -U is mandatory: this pod runs as uid 65532, that uid is not in the
          # image's /etc/passwd, and libpq refuses to guess a default user name —
          # without it pg_isready never opens a socket and reports "no attempt"
          # while DNS resolves perfectly. 30-migrate-job.yaml carries the full
          # measurement and psql's plainer error message.
          #
          # 🔴 AND THE NAME IS tappa_app, NOT tappa_owner, IN THIS POD. pg_isready
          # never authenticates -- it sends a startup packet and reads the auth
          # challenge -- so the name is only a string and either one works. But it is
          # a string this pod WRITES ONTO THE NETWORK, and two things follow from
          # which string it is. First, the internet-facing pod should not be naming
          # the migration role at all. Second, and this is the one that bites:
          # scripts/verify-deployment.sh's db-role gate fires on a backend with
          # usename='tappa_owner' AND client_addr NOT NULL, and its message says
          # "tenant isolation is void". With tappa_owner here, THE PRODUCT'S OWN
          # HEALTH PROBE could raise that alarm. The timing does not overlap today
          # (an initContainer finishes before the main container is created, and the
          # gate runs after rollout status) and the gate's own comment counts that --
          # but a false-alarm channel into the one gate that guards §4.5 is not worth
          # a string. 30-migrate-job.yaml keeps tappa_owner, because that pod really
          # does connect as that role.
          # The failure branch resolves the name itself rather than trusting
          # pg_isready's wording: a closed port, a dropped packet AND an unresolvable
          # name all print "no response" with exit 2 (measured against pg_isready
          # 17.10). 30-migrate-job.yaml carries the full reasoning; this is the same
          # text so an operator meets one message, not two.
          command:
            - sh
            - -ceu
            - |
              deadline=$(( $(date +%s) + 120 ))
              until pg_isready -h tappa-postgres -p 5432 -U tappa_app -d tappa -t 3 >/dev/null 2>&1; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "tappa-postgres:5432 unreachable from this pod after 120 s" >&2
                  echo "pg_isready says: $(pg_isready -h tappa-postgres -p 5432 -U tappa_app -d tappa -t 3 2>&1)" >&2
                  if addr=$(getent hosts tappa-postgres 2>/dev/null); then
                    echo "the NAME RESOLVES to: $addr" >&2
                    echo "COMPARE that address with the pod's own:" >&2
                    echo "  kubectl -n <ns> get pod tappa-postgres-0 -o wide" >&2
                    echo "If they DIFFER the name resolves to the wrong place - a stale" >&2
                    echo "EndpointSlice or a cached CoreDNS answer (default TTL 30 s) - and" >&2
                    echo "this is still DNS, not the policy. If they MATCH it is the socket:" >&2
                    echo "look at 12-networkpolicy.yaml (a denial there arrives as a TCP RST," >&2
                    echo "not a timeout), then at whether tappa-postgres-0 is Running and" >&2
                    echo "listening on 0.0.0.0:5432." >&2
                  else
                    echo "the NAME tappa-postgres DOES NOT RESOLVE." >&2
                    echo "This is DNS or the Service, NOT the NetworkPolicy: check that" >&2
                    echo "Service/tappa-postgres exists, that it has an EndpointSlice" >&2
                    echo "(a headless Service publishes no record until a pod is Ready)," >&2
                    echo "and that CoreDNS in kube-system is answering." >&2
                  fi
                  exit 1
                fi
                sleep 1
              done
              echo "tappa-postgres:5432 reachable from this pod; the server may dial"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
      containers:
        - name: tappa
          # The tag is substituted by .github/workflows/deploy.yml. The placeholder
          # is a syntactically valid tag so that `kubectl apply --dry-run` on the
          # unmodified file is still a real check.
          image: docker.io/atknatk/tappa:deploy-placeholder
          # 🔴 IfNotPresent IS LOAD-BEARING HERE, NOT A DEFAULT — AND IT IS ONLY SAFE
          # BECAUSE THE TAG ABOVE IS IMMUTABLE. deploy.yml builds and pushes exactly
          # ONE tag per image, `sha-<12hex>`, and substitutes it into this file, so a
          # tag never names two different images. IfNotPresent plus a moving tag
          # (`:main`, `:latest`) is how a node silently keeps serving last week's
          # binary — this repository's signature defect class, which is also why
          # `:main` is no longer built or pushed at all: it was referenced by nothing
          # and, on a public registry, is a moving tag a human could reach for.
          #
          # ⚠️ Always would be wrong here for the ordinary reason — it makes every
          # restart depend on a registry round trip, and this product's failure story
          # is a 04:00 shift that cannot load the tap page. Whether it is ALSO wrong
          # for the CREDENTIAL reason depends on the registry the running pods were
          # pulled from, which is a fact about the cluster and is recorded in exactly
          # one place (deploy/README.md, "Elle deploy / rollback"): while the pull
          # needs a credential, Always re-contacts the registry on every restart with
          # a token that may already be revoked; once it is anonymous, that reason
          # lapses. See the block above the securityContext. IfNotPresent stays
          # because it is the policy that asks the registry LEAST.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: tappa-config
          # 🔴 THE SECRET IS PULLED IN KEY BY KEY AND NOT WITH envFrom, AND THAT IS
          # THE MECHANISM BEHIND M8-02's "uygulama ASLA migration rolüyle
          # bağlanmıyor". `envFrom: secretRef` would put EVERY key of tappa-secrets
          # into this process's environment — including DATABASE_MIGRATE_URL, whose
          # role (tappa_owner) is initdb's bootstrap SUPERUSER and bypasses RLS
          # unconditionally. A compromised server process would then hold a
          # ready-made credential for reading every tenant's rows. Listing only the
          # names it needs means there is nothing to reach for. (There are FIVE
          # now: the fifth, TAPPA_TAG_KEK_PREVIOUS, is optional and present only
          # during a KEK rotation. The count is stated here because it was stale
          # once; what actually keeps this list honest is
          # TestPackaging_EverySecretConfigReadsIsInjectedByTheManifest.)
          #
          # internal/config does read DATABASE_MIGRATE_URL, but only to REFUSE a
          # deployment where the two DSNs are equal; unset skips the comparison.
          # Measured 2026-08-15 with the shipped image and the variable absent: the
          # process passed config validation and went on to dial the database.
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tappa-secrets
                  key: DATABASE_URL
            - name: TAPPA_SESSION_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: tappa-secrets
                  key: TAPPA_SESSION_HMAC_KEY
            - name: TAPPA_TAG_KEK
              valueFrom:
                secretKeyRef:
                  name: tappa-secrets
                  key: TAPPA_TAG_KEK
            - name: TAPPA_INVITE_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: tappa-secrets
                  key: TAPPA_INVITE_HMAC_KEY
            # 🔴 OPTIONAL, AND `optional: true` IS LOAD-BEARING: this key is ABSENT
            # from tappa-secrets except during a KEK rotation, and without the flag
            # kubelet refuses to start the pod on a missing Secret key. So the
            # steady state needs it optional, and the rotation needs it listed.
            #
            # LISTING IT IS NOT OPTIONAL, AND THAT WAS MEASURED THE HARD WAY. The
            # secret is pulled key by key (see above), so a key nobody names here
            # never reaches the process no matter what the Secret holds. The first
            # version of the rotation runbook said "add TAPPA_TAG_KEK_PREVIOUS to
            # tappa-secrets and roll out" while this list had four entries: the
            # rollout would go GREEN, the variable would never be injected,
            # config.Load would see it unset and carry on with ONE KEK, and the
            # first step of the rotation would put the entire park behind a key the
            # server does not hold — every tap answering 500 and no transaction row
            # written at all (CLAUDE.md §4.6, at the infrastructure layer). The
            # rollback path depended on the same missing injection, so it would not
            # have worked either.
            #
            # WHAT KEEPS THIS LIST HONEST is not this comment: it is
            # TestPackaging_EverySecretConfigReadsIsInjectedByTheManifest, which
            # fails if internal/config reads a variable this file does not name.
            - name: TAPPA_TAG_KEK_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: tappa-secrets
                  key: TAPPA_TAG_KEK_PREVIOUS
                  optional: true
          # ------------------------------------------------------------ probes --
          #
          # 🔴 LIVENESS IS /healthz AND READINESS IS /readyz, NEVER THE OTHER WAY
          # ROUND. /readyz touches the pool; if it were the liveness probe, a
          # database outage would restart every pod, turning a recoverable outage
          # into a crash-loop that also destroys the in-flight requests the server's
          # own drain exists to protect. /healthz touches nothing and answers in
          # microseconds (M8-01 measured 0.0008 s while /readyz was blocked on a
          # hung database for 2 s), so it answers exactly one question: is this
          # process alive.
          #
          # THE NUMBERS COME FROM M8-01's MEASURED CONSTANTS, not from habit:
          #   defaultReadyTTL     1 s   /readyz caches its answer for this long
          #   defaultProbeTimeout 2 s   the DB ping inside /readyz gives up here
          #                             (measured under a hung DB with 300
          #                             concurrent callers: max 2.001 s)
          #
          # timeoutSeconds: 3 is deliberately ABOVE that 2 s. If the kubelet gave up
          # first, every DB stall would be reported as a probe TIMEOUT — no status
          # code, no body, and the application's own distinction between "I answered
          # 503 because the database is unreachable" and "I did not answer" would be
          # erased at exactly the moment somebody needs it.
          #
          # periodSeconds: 5 is above the 1 s cache, so no two probes can share one
          # cached answer: every probe is a fresh measurement. It also leaves 3 s of
          # slack after the worst-case 2 s so probes cannot overlap.
          #
          # failureThreshold: 3 → out of rotation after ~15 s of sustained failure,
          # which on ONE replica means the Service has no endpoint and callers get a
          # connection refusal rather than a wrong answer.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            # 60 s of grace. The process cannot legitimately take longer: config
            # validation is synchronous and the pool dial has its own 10 s ceiling,
            # after which the process EXITS rather than serving without a database
            # (measured: exit 1, "db: ping: context deadline exceeded").
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            # The image is `scratch` plus two files and the process opens nothing at
            # runtime (M8-01 measured os.ReadFile/os.Open/http.Dir → 0 matches in
            # production code). Verified against the built image on 2026-08-15:
            # `docker run --read-only --cap-drop=ALL` boots, logs its build identity
            # and reaches the database dial.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            # See 10-postgres.yaml for the node measurement these are sized against.
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
