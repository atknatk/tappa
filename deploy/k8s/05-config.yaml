# Tappa — the NON-SECRET half of the server's environment (M8-02).
#
# Everything here is safe in a public git history. The values that are not
# (DATABASE_URL, the 32-byte keys, and the optional operator and SMTP credentials)
# live in a Secret this repository never contains — see deploy/examples/.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tappa-config
  namespace: tappa
  labels:
    app.kubernetes.io/name: tappa
data:
  # internal/config refuses anything outside {dev, staging, prod}; "production"
  # would be a startup failure rather than a silent downgrade. It is what makes the
  # session cookie Secure (internal/session reads IsProd).
  TAPPA_ENV: "prod"
  TAPPA_ADDR: ":8080"
  # 🔴 THIS IS THE CANONICAL ORIGIN AND IT MINTS SUN URLs INTO PHYSICAL TAGS. It moves
  # in lockstep with deploy/k8s/40-ingress.yaml's serving host: the apex there is the
  # only host that mints URLs, and the value here IS that apex. Changing one without
  # the other means links point at a host the ingress does not serve. Domain cutover
  # tappa.everva.com.tr → taptime.mt, 2026-09-02; the old host now 301-redirects here.
  TAPPA_BASE_URL: "https://taptime.mt"
  TAPPA_LOG_LEVEL: "info"

  # 🔴 json HERE AND text EVERYWHERE ELSE, BECAUSE THE READER IS DIFFERENT AND IT
  # WAS MEASURED IN THIS CLUSTER (M8-03, 2026-08-19).
  #
  # A developer reads logfmt with their eyes; THIS deployment's logs are read by a
  # machine. The signoz `k8s-infra-otel-agent` DaemonSet tails
  # /var/log/pods/*/*/*.log and its exclude list does NOT name this namespace, so
  # every line this process writes is already being shipped to ClickHouse
  # (in-cluster: http://signoz-otel-collector.signoz.svc.cluster.local:4318 — it
  # does not leave the node, which is the AB half of M8-03's fourth criterion).
  #
  # WHAT BREAKS WITH text: that agent's filelog receiver runs exactly ONE operator,
  # `container`, which unwraps the CRI envelope and stops. There is no logfmt
  # parser anywhere in the pipeline, so a `key=value` body arrives as a single
  # opaque string and every alert rule in deploy/README.md — all six signals —
  # matches zero rows. That renders as "no rejects, no security attempts, no 5xx",
  # which is exactly what a healthy system looks like.
  #
  # A TYPO HERE IS A STARTUP FAILURE, not a downgrade: internal/config keeps this
  # to a closed set for the same reason TAPPA_ENV is closed.
  TAPPA_LOG_FORMAT: "json"

  # 🔴 TAPPA_TRUSTED_PROXIES — backlog T30, AND THE VALUE BELOW WAS MEASURED IN THIS
  # CLUSTER ON 2026-08-15 RATHER THAN GUESSED.
  #
  # What breaks if this is wrong, in the product's own terms: internal/httpx walks
  # X-Forwarded-For from the RIGHT and stops at the first address that is not in this
  # list. Too narrow (or empty) and the walk never starts — every caller in the world
  # resolves to the ingress hop, so §5's "IP eşleşti" (50 of 100 trust points) can
  # never be true for anyone, and the panel's login budget (adminLoginWorkLimit =
  # 120 per 10 min PER ADDRESS, T30) collapses onto ONE address shared by every
  # customer. Too wide and the walk runs off the left end and returns whatever the
  # CLIENT wrote — proof of place becomes caller-chosen. config.Load refuses a
  # default route outright in prod, which catches only the crudest spelling of that.
  #
  # THE MEASUREMENT. ingress-nginx here is a DaemonSet with hostNetwork: true
  # (`kubectl -n ingress-nginx get pods -o jsonpath='{...spec.hostNetwork}'` → true,
  # podIP 10.0.0.10, hostPorts 80/443), so it proxies from the NODE's network
  # namespace into the pod network. The source address it uses is the route's, not
  # the node's public one:
  #
  #   $ kubectl -n ingress-nginx exec ds/ingress-nginx-controller -- ip route get 10.42.0.5
  #   10.42.0.5 dev cni0  src 10.42.0.1
  #
  # 10.42.0.1 is cni0 itself — the bridge address. Flannel allocates pod addresses
  # from 10.42.0.2 upward (podCIDR 10.42.0.0/24), so NO POD CAN EVER HOLD THIS
  # ADDRESS. A /32 here therefore trusts exactly one thing: this node's own
  # forwarding path. The alternative that "works" — trusting the whole 10.42.0.0/24
  # pod CIDR — would extend the trust to every pod of the ~30 other namespaces on
  # this cluster, any of which could then forge a client address for Tappa.
  #
  # ⚠️ VERIFY AFTER THE FIRST DEPLOY, because a value that is only reasoned about is
  # the failure T30 describes. Tap once from a phone on mobile data and read the row:
  #   SELECT ip_match, source_ip FROM transactions ORDER BY created_at DESC LIMIT 1;
  # source_ip must be the PHONE's public address. If it is 10.42.0.1 the list is too
  # narrow; if it is anything a caller could have chosen, it is too wide.
  TAPPA_TRUSTED_PROXIES: "10.42.0.1/32"

  # 🟡 TAPPA_RETENTION_YEARS — TEMPORARY, AND IT IS A LEGAL STATEMENT RATHER THAN A
  # SETTING (backlog B3 / open question Q13).
  #
  # This number is printed verbatim to an employee in the GDPR Art. 13 notice on the
  # activation screen. internal/config gives it no default on purpose: a figure that
  # appeared out of a Go constant would be this repository inventing a legal claim on
  # a customer's behalf (user decision, 2026-07-31). The value below is the same
  # DEVELOPMENT PLACEHOLDER .env.example carries and it has NOT been through a
  # lawyer. It is written here because the process will not boot without one, not
  # because two years is the answer.
  #
  # 🔴 THE PILOT GATE ALREADY DEPENDS ON THIS. M8-06's gate lists "saklama süresi ve
  # silme/anonimleştirme akışı karara bağlı (Q13)" as one of six boxes that must be
  # ticked BEFORE real employees tap. Deploying with this placeholder is fine;
  # PILOTING with it is not, and this comment is where that distinction is recorded.
  TAPPA_RETENTION_YEARS: "2"

  # 🔴 TRANSACTIONAL E-MAIL (ADR 0022; M10 EM-3) — BOTH FLOWS OFF, WHICH IS TODAY'S
  # BEHAVIOUR, UNCHANGED. Each mode is a closed set and an unknown value is a startup
  # failure, never a silent fallback (internal/config.deliveryMode):
  #   TAPPA_RESET_DELIVERY   none | email   none: the panel's recovery form says on
  #                                         screen that this deployment sends no link,
  #                                         and no "your password was changed" notice
  #                                         goes either (M10 EM-9: one switch, both)
  #   TAPPA_INVITE_DELIVERY  panel | email  panel: the activation link is shown on the
  #                                         manager's own screen (ADR 0005 Y-D)
  # "email" is valid configuration; the reset channel exists since EM-5, and for
  # invitations THIS BUILD REFUSES TO BOOT ON IT until EM-7. Switching a flow on is a deploy
  # decision, made AFTER the two SMTP credentials are in tappa-secrets — a flow on with
  # a credential missing is a startup failure. maxUnavailable: 0 keeps the OLD pod
  # serving only while that pod lives: the deploy applies this ConfigMap first, so a
  # recreated old pod (drain, eviction) reads it and refuses too, and with replicas: 1
  # the tap surface is down. Revert this ConfigMap AT ONCE — `rollout undo` does not
  # bring it back (deploy/README.md, "Transactional e-mail", step 3).
  # cmd/tappa's TestPackaging_TheConfigMapShipsTodaysDelivery pins these two values.
  TAPPA_RESET_DELIVERY: "none"
  TAPPA_INVITE_DELIVERY: "panel"

  # The relay (ADR 0022 §1, §5): AWS SES's SMTP endpoint in eu-central-1, STARTTLS on
  # 587. NOT READ while both flows above are off — and therefore not checked at boot
  # either: TestPackaging_TheConfigMapsMailSettingsLoadInProduction loads them with
  # both flows on, so a wrong value here is red in CI rather than on the day of the
  # switch. In production the host may not be localhost, a *.localhost name or an IP
  # address in any spelling (other loopback names are not refused), and 465 (implicit
  # TLS) is refused in every environment.
  # The two credentials are NOT here: they are tappa-secrets keys (20-app.yaml).
  TAPPA_SMTP_HOST: "email-smtp.eu-central-1.amazonaws.com"
  TAPPA_SMTP_PORT: "587"
  # The fixed sender (ADR 0022 K5): no tenant name in the header (ADR 0023 §8).
  TAPPA_MAIL_FROM: "Taptime <no-reply@taptime.mt>"
  # Optional, and EMPTY on purpose — empty is unset: no Reply-To header, so a reply
  # goes to the no-reply sender. Set, it must be ONE bare address (no display name).
  # No mailbox for replies is decided yet; inventing one here would be worse.
  TAPPA_MAIL_REPLY_TO: ""

  # The decision-engine windows (CLAUDE.md §5). They are the shipped defaults,
  # written out rather than left implicit because the Policies screen shows a
  # customer these exact numbers and an operator changing one should find it here.
  TAPPA_GPS_RADIUS_M: "150"
  TAPPA_DEBOUNCE_SECONDS: "60"
  # Below 900 deliberately: at 900 the recorded sys:tap-freshness band is EXACTLY
  # empty, because the signed tap context's own 15-minute TTL refuses first.
  TAPPA_FRESHNESS_SECONDS: "180"

  # (Tappa's own legal texts are published by the platform operator on its own host,
  # /operator/legal -- M10 OP-10, ADR 0020 §7. The customer panel's legal screen and
  # its env allow-list were removed with it; there is no key for it here.)
