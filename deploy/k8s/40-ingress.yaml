# Tappa — TLS ingress (M8-02; domain cutover to taptime.mt, 2026-09-02).
#
# 🔴 DOMAIN CUTOVER. The primary host is now `taptime.mt`. `tappa.everva.com.tr`
# was the deploy target through M8; it is kept below ONLY as a 301 redirect (Ingress
# `tappa-redirects`) so links minted before the cutover still land. TAPPA_BASE_URL in
# 05-config.yaml moves in lockstep with this file, and the proxy-off gate in
# .github/workflows/deploy.yml + scripts/verify-deployment.sh now names taptime.mt —
# the four move together or the invariant below is unchecked on the host that actually
# takes taps.
#
# 🔴 EXACTLY ONE HOST SERVES THE APP, AND THAT IS DELIBERATE. The `tappa` Ingress
# below serves ONLY taptime.mt. Every other name we answer — the legacy domain and
# www — 301s to it from the `tappa-redirects` Ingress and NEVER reaches the app. That
# is what lets the proxy-off gate check a single host and still cover every path a tap
# can arrive on: a request that could process a tap can only land on taptime.mt. A www
# rule pointed at the app would reopen that gap (a proxied www would then feed a
# Cloudflare edge address into §5's proof of place), so www is redirect-only.
#
# 🔴 THIS HOSTNAME MUST NOT BE PROXIED BY CLOUDFLARE, AND THAT IS THE SINGLE MOST
# CONSEQUENTIAL LINE IN THIS DIRECTORY. The rule predates taptime.mt; it was measured
# on the sibling zone on 2026-08-15, before anything was written:
#
#   $ dig +short tappa.everva.com.tr        → 104.21.72.109, 172.67.181.173
#   $ dig +short NS everva.com.tr           → bryce.ns.cloudflare.com, magdalena...
#   $ curl -sS -o /dev/null -D - https://argocd.everva.com.tr/
#     server: cloudflare        cf-ray: a2b98ed718d0bc94-MXP
#
# everva.com.tr is on Cloudflare with a PROXIED WILDCARD: an invented subdomain
# resolves to the same two Cloudflare addresses, so tappa.everva.com.tr answered
# through Cloudflare before any record was created for it, and a DNS-only record had
# to be written to override the wildcard. Another Ingress in this cluster
# (optiway-stg-api-ws) hashes on $http_cf_connecting_ip, which is the same fact from
# the other side.
#
# taptime.mt IS A CONTROLLED ZONE and its records were created DNS-only, not left to
# a default. It lives in the operator's Cloudflare account (zone created 2026-09-02);
# the apex A record and the www CNAME were both created with the proxy OFF (grey
# cloud), and — unlike everva.com.tr — this zone has NO proxied wildcard to fight.
# Verified after creation, which is the only proof that matters here:
#   $ dig +short taptime.mt        → 144.76.158.60   (the origin, NOT a CF edge addr)
# A Cloudflare edge address (104.21.* / 172.67.*) here would mean the proxy is back on.
#
# WHY THAT BREAKS THIS PRODUCT SPECIFICALLY. ingress-nginx here runs with an EMPTY
# ConfigMap (`kubectl -n ingress-nginx get cm ingress-nginx-controller -o
# jsonpath='{.data}'` → empty), so use-forwarded-headers is at its default of false
# and nginx SETS X-Forwarded-For to $remote_addr — discarding whatever the hop in
# front wrote. With Cloudflare in front, $remote_addr is a Cloudflare edge address,
# so:
#
#   - §5's proof of place (an IP match is 50 of 100 trust points) could never be
#     true for anybody. Every tap would fall to GPS-only or to `flag`.
#   - The panel's login budget is keyed by address (adminLoginWorkLimit = 120 per
#     10 min, backlog T30). Every customer in the product would share one key.
#   - And the mirror image of backlog T40: a venue configured with a Cloudflare
#     range would make `ip_match=t` true for the entire internet, written into an
#     immutable transactions row as "network proof of place".
#
# THE THREE WAYS OUT WERE WEIGHED AND ONLY ONE IS IN SCOPE:
#   (a) DNS-only (grey cloud) for this host. Nothing shared changes, no third party
#       is trusted for the client address, and the GDPR surface SHRINKS — routing
#       employees' tap traffic (IP + GPS) through a US processor would add a
#       sub-processor to the DPA that M8-02's Q23 criterion requires. CHOSEN.
#   (b) Set use-forwarded-headers=true plus proxy-real-ip-cidr on the SHARED
#       ingress-nginx ConfigMap. That changes the client-address handling of ~20
#       other applications on this cluster, and if proxy-real-ip-cidr is wrong,
#       anyone reaching the origin IP directly can forge XFF for all of them.
#   (c) Read CF-Connecting-IP in the application. New code, and a header that is
#       only trustworthy if the origin refuses non-Cloudflare traffic.
#
# ⚠️ HOW TO VERIFY (a) AFTER THE CUTOVER — one command, and it is not optional,
# because this is a property nothing in the cluster will report:
#   curl -sS -o /dev/null -D - https://taptime.mt/ | grep -i 'cf-ray\|server'
# A `cf-ray` header means the record is still proxied and proof-of-place is dead.
#
# ---------------------------------------------------------------------------
# TLS AND HSTS (backlog T28), MEASURED RATHER THAN ASSUMED.
#
# T28 recorded that Strict-Transport-Security is set nowhere in the product's own
# code (0 matches) and that where it belongs is a deployment decision. Measured on
# this cluster, against the ORIGIN directly so the answer is the ingress's and not
# Cloudflare's:
#
#   $ curl -sS -o /dev/null -D - -k --resolve argocd.everva.com.tr:443:144.76.158.60 \
#         https://argocd.everva.com.tr/
#     strict-transport-security: max-age=31536000; includeSubDomains
#
# So ingress-nginx already sends HSTS for every host it serves, at one year with
# includeSubDomains, and this Ingress inherits it. Two things follow, and both are
# stated because a header that arrives by inheritance is a header nobody owns:
#
#   - includeSubDomains now scopes to *.taptime.mt — and because taptime.mt is the
#     APEX (not a subdomain as tappa.everva.com.tr was), that pins the WHOLE zone to
#     HTTPS, including www. That is the intent: every host we serve here is HTTPS.
#   - preload is NOT set and must not be set casually: it is submitted to a browser
#     list and takes months to undo. Out of scope for the cutover.
#   - HSTS is per-CONTROLLER (a ConfigMap option), not per-Ingress: there is no
#     annotation here that could turn it off or on for this host alone, and snippet
#     annotations are disabled by default in ingress-nginx ≥1.9. The application-side
#     half of T28 — the product setting its own header so it does not depend on a
#     shared controller's default — is therefore still open.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tappa
  namespace: tappa
  labels:
    app.kubernetes.io/name: tappa
  annotations:
    # cert-manager solves HTTP-01 against this host. taptime.mt resolves DNS-only to
    # the origin, which answers on :80 (the challenge path routes there), so a fresh
    # certificate is issued into the `taptime-tls` secret on first apply. There is a
    # brief window between apply and issuance where https://taptime.mt has no valid
    # cert — expected for a cutover, verified with the curl above once it clears.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # 🔴 PLAIN HTTP IS NOT MERELY UNTIDY FOR THIS PRODUCT, IT IS BROKEN — and both
    # halves were measured on 2026-08-15 (backlog T38 and T39):
    #   T39  getCurrentPosition refuses a non-secure origin outright ("Only secure
    #        origins are allowed", code 1 — no permission prompt at all), so GPS,
    #        one of §5's four evidences, is silently absent and the only trace is
    #        gps_lat IS NULL in the record.
    #   T38  Sec-Fetch-* headers are withheld from non-secure origins, and the
    #        panel's same-origin gate has no lenient mode, so NOBODY can sign in
    #        over plain HTTP from anything but localhost.
    # A redirect is what keeps a mistyped http:// link from producing either.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Every request this product accepts is a form post or a small JSON body. The
    # largest is a legal document body typed into /admin/legal.
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - taptime.mt
      secretName: taptime-tls
  rules:
    - host: taptime.mt
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tappa
                port:
                  name: http
---
# 🔴 EVERY NON-CANONICAL HOST 301s HERE — NOT ONE OF THEM SERVES CONTENT. Two hosts
# redirect to https://taptime.mt with the path+query preserved:
#
#   - tappa.everva.com.tr — the deploy target through M8. A SUN URL carries its domain
#     into the physical tag and §4.3 makes a transactions row immutable, so any link
#     or plaque minted before the cutover must keep resolving; it must not 404.
#   - www.taptime.mt — kept redirect-only ON PURPOSE (see the header of the `tappa`
#     Ingress): if www served the app, a later proxied www would feed a Cloudflare
#     edge address into §5's proof of place, and the single-host proxy-off gate would
#     not see it. A 301 processes no tap, so a proxied www could at worst mis-redirect,
#     never mis-attribute a tap.
#
# The two hosts get SEPARATE certificates so neither can hold the other hostage:
# tappa.everva.com.tr reuses the existing valid `tappa-tls` (so the cutover triggers
# NO re-issuance for it), and www.taptime.mt gets its own `taptime-www-tls`, isolated
# from the apex's `taptime-tls` — a stuck www challenge cannot delay the apex cert.
#
# 🔴 THE VALUE IS scheme+host WITH NO $request_uri, AND THAT IS THE INGRESS-NGINX
# IDIOM, NOT A LOST FEATURE. The controller appends the request path+query itself, so
# the annotation carries only the target host; a literal "$request_uri" in the value
# is rejected by the admission webhook ("permanent-redirect contains invalid value",
# an injection guard) — which is exactly what failed the first cutover deploy. Path
# preservation is therefore the controller's job, verified below.
#
# ⚠️ TWO THINGS TO VERIFY AFTER THE FIRST DEPLOY, because both are properties to
# confirm rather than assume:
#   1. The redirect preserves the path+query (the controller-appended $request_uri):
#      curl -sS -o /dev/null -D - https://tappa.everva.com.tr/activate?x=1 | grep -i location
#      → location: https://taptime.mt/activate?x=1
#   2. cert-manager can still RENEW tappa-tls (~60 days out) THROUGH the redirect: the
#      HTTP-01 solver Ingress adds a more-specific /.well-known/acme-challenge/<token>
#      location that should take precedence over this `/` redirect. Confirm before the
#      first renewal, or retire the legacy host before tappa-tls expires:
#      curl -sS -o /dev/null -D - http://tappa.everva.com.tr/.well-known/acme-challenge/probe
#      → NOT a 301 to https (a 404 from the origin is the healthy answer here).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tappa-redirects
  namespace: tappa
  labels:
    app.kubernetes.io/name: tappa
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/permanent-redirect: "https://taptime.mt"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tappa.everva.com.tr
      secretName: tappa-tls
    - hosts:
        - www.taptime.mt
      secretName: taptime-www-tls
  rules:
    # Backends are required by the Ingress schema even though the redirect fires
    # before the request reaches them; they point at the same service, never used.
    - host: tappa.everva.com.tr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tappa
                port:
                  name: http
    - host: www.taptime.mt
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tappa
                port:
                  name: http
