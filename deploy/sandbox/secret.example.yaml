# The sandbox's Secret, as a TEMPLATE (never applied as it is; no value here is real). Every key is
# the SANDBOX'S OWN, generated for it with `openssl rand -base64 32` and kept in Infisical under the
# sandbox's own path -- NEVER a copy of production's (ADR 0028 §11: "Sandbox kendi anahtar ve
# KEK'leriyle kurulur"): a sandbox KEK equal to production's would open a production plaque key, a
# sandbox key-hash key equal to production's would make one HMAC answer for both. Each value also
# differs from every other value here (config.Load refuses an equal pair).
#
# The operator surface's four are REQUIRED here (unlike production's optional ones): the sandbox's
# own operator opens each business's API (K-22). TAPPA_OPERATOR_HOST is ops.SANDBOX_DOMAIN.
# TAPPA_SMTP_* are absent on purpose: the sandbox sends no e-mail.
apiVersion: v1
kind: Secret
metadata:
  name: tappa-secrets-example-do-not-apply
  namespace: tappa-sandbox
  labels:
    app.kubernetes.io/name: tappa-sandbox
type: Opaque
stringData:
  DATABASE_URL: "postgres://tappa_app:REPLACE_APP_PASSWORD@tappa-postgres:5432/tappa?sslmode=disable"
  DATABASE_MIGRATE_URL: "postgres://tappa_owner:REPLACE_OWNER_PASSWORD@tappa-postgres:5432/tappa?sslmode=disable"
  POSTGRES_PASSWORD: "REPLACE_OWNER_PASSWORD"
  TAPPA_APP_PASSWORD: "REPLACE_APP_PASSWORD"
  TAPPA_SESSION_HMAC_KEY: "REPLACE_ME"
  TAPPA_TAG_KEK: "REPLACE_ME"
  TAPPA_INVITE_HMAC_KEY: "REPLACE_ME"
  TAPPA_API_KEY_HMAC_KEY: "REPLACE_ME"
  TAPPA_WEBHOOK_KEK: "REPLACE_ME"
  TAPPA_OPERATOR_DATABASE_URL: "postgres://tappa_operator:REPLACE_OPERATOR_PASSWORD@tappa-postgres:5432/tappa?sslmode=disable"
  TAPPA_OPERATOR_TOTP_KEK: "REPLACE_ME"
  TAPPA_OPERATOR_TOKEN_HMAC_KEY: "REPLACE_ME"
  TAPPA_OPERATOR_HOST: "ops.SANDBOX_DOMAIN"
