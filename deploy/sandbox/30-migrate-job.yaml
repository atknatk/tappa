# The sandbox's schema (ADR 0028 §11): production's migration image -- the migrations are one set,
# the sandbox's database is migrated by exactly the statements production's is -- run as the
# sandbox database's owner, from the sandbox's own Secret. The image tag is a placeholder until the
# sandbox's deploy path exists (deploy/README.md, "Sandbox (API-11)").
apiVersion: batch/v1
kind: Job
metadata:
  name: tappa-migrate
  namespace: tappa-sandbox
  labels:
    app.kubernetes.io/name: tappa-sandbox
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tappa-sandbox
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: goose
          image: docker.io/atknatk/tappa-migrate:deploy-placeholder
          imagePullPolicy: IfNotPresent
          env:
            - name: GOOSE_DBSTRING
              valueFrom:
                secretKeyRef:
                  name: tappa-secrets
                  key: DATABASE_MIGRATE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
