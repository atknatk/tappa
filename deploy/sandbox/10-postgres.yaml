# The sandbox's OWN Postgres (ADR 0028 §11: "ayrı namespace + Postgres"). Production's database is
# never reachable from here (12-networkpolicy.yaml, and production's own policy admits only its
# namespace's pods), and a production backup is NEVER restored into it (ADR 0028 §11) -- the
# sandbox's data is integrators' test data only.
#
# The same image, roles and init scripts as production (deploy/k8s/10-postgres.yaml): the init
# ConfigMap tappa-db-init is created from scripts/db-init/01-roles.sql and
# deploy/k8s/postgres-init/02-app-password.sh in THIS namespace (deploy/README.md, Sandbox step 4).
apiVersion: v1
kind: Service
metadata:
  name: tappa-postgres
  namespace: tappa-sandbox
  labels:
    app.kubernetes.io/name: tappa-sandbox
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: tappa-sandbox
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tappa-postgres
  namespace: tappa-sandbox
  labels:
    app.kubernetes.io/name: tappa-sandbox
    app.kubernetes.io/component: postgres
spec:
  serviceName: tappa-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tappa-sandbox
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tappa-sandbox
        app.kubernetes.io/component: postgres
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: tappa_owner
            - name: POSTGRES_DB
              value: tappa
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
            - name: TZ
              value: UTC
            - name: PGTZ
              value: UTC
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tappa-secrets
                  key: POSTGRES_PASSWORD
            - name: TAPPA_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tappa-secrets
                  key: TAPPA_APP_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "tappa_owner", "-d", "tappa"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "tappa_owner", "-d", "tappa"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: init
          configMap:
            name: tappa-db-init
            defaultMode: 0555
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: tappa-sandbox
          app.kubernetes.io/component: postgres
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
