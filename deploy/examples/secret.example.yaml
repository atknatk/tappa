# Tappa — SECRET TEMPLATE (M8-02). THIS FILE HOLDS NO VALUES AND NEVER WILL.
#
# 🔴 DO NOT FILL THIS FILE IN. Copy it, fill the copy, apply the copy, then deal
# with the copy as the ESCROW section below says. `deploy/secret.yaml` is in
# .gitignore for exactly that use, so a filled copy under that name cannot be
# committed by accident. CLAUDE.md §4.7: "NTAG AES anahtarlari repoda yer almaz" —
# TAPPA_TAG_KEK is the key that unwraps every plaque's AES key in the park, so this
# file is the one place where a careless paste is a park-wide compromise.
#
# 🔴 TWO THINGS ABOUT THIS FILE ARE DELIBERATE AND BOTH FIX A MEASURED HAZARD
# (2026-08-15, security audit):
#
#   (1) IT LIVES IN deploy/examples/ AND NOT IN deploy/k8s/. It used to sit beside
#       the real manifests, and the natural thing an operator does at 04:00 is
#       `kubectl apply -f deploy/k8s/`. Measured: that command listed
#       `Secret/tappa-secrets ns=tappa` — it would have overwritten the LIVE session
#       key, invite key and KEK with the literal string REPLACE_ME, logging every
#       employee out and leaving the server unable to unwrap a single plaque. The
#       same command now touches only the eight appliable objects.
#
#   (2) ITS metadata.name IS NOT THE LIVE NAME. It is
#       `tappa-secrets-example-do-not-apply`, so even applying THIS FILE directly
#       creates an inert object beside the real one instead of replacing it. The copy
#       you fill in must have its name changed to `tappa-secrets` — and that edit is
#       the point at which you are meant to notice what you are doing.
#
#   cp deploy/examples/secret.example.yaml deploy/secret.yaml
#   # fill it in, AND change metadata.name to: tappa-secrets
#   kubectl apply -f deploy/secret.yaml
#
# ----------------------------------------------------------------------------
# 🔴 ESCROW — READ THIS BEFORE DELETING THE COPY.
#
# The earlier advice here was simply `rm`, and it was wrong in a direction that
# cannot be undone. Four of these values can be regenerated at the cost of an
# inconvenience; ONE cannot:
#
#   TAPPA_SESSION_HMAC_KEY  losing it logs every employee out. Annoying, recoverable.
#   TAPPA_INVITE_HMAC_KEY   losing it voids outstanding activation codes. Same.
#   POSTGRES_PASSWORD       losing them is one ALTER ROLE away from fixed.
#   TAPPA_APP_PASSWORD
#   TAPPA_TAG_KEK           🔴 LOSING IT IS PERMANENT. It wraps every plaque's NTAG
#                           AES key (tags.aes_key_ref). Without it not one plaque in
#                           the park can be verified, and there is no derivation, no
#                           backup and no reset — the only recovery is physically
#                           re-encoding every plaque on every wall and re-loading its
#                           row.
#
# So it must exist in exactly one more place than the cluster, and that place must be
# durable and access-controlled: the Infisical project (which is why
# externalsecret.example.yaml beside this file is the RECOMMENDED route), a password
# manager entry, or a sealed envelope in a safe. "It is in the cluster" is NOT
# escrow — a Secret lives in one etcd, on one node, with no backup, and the warning
# at the top of deploy/k8s/10-postgres.yaml applies to etcd just as much.
#
# ⚠️ AND THE ROTATION HALF DOES NOT EXIST YET. M8-02 requires a KEK rotation
# procedure that is "yazılı VE YÜRÜTÜLEBİLİR — tüm parkın tags.aes_key_ref
# değerlerini yeniden sarmalayan araç var". No such tool is in this repository. Until
# there is one, a suspected KEK leak has no executable response; that is a stated
# open criterion, not an oversight.
#
# ----------------------------------------------------------------------------
# GENERATING THE VALUES — and the two encodings are NOT interchangeable.
#
#   the three 32-byte keys        openssl rand -base64 32
#   the two database passwords    openssl rand -hex 32
#
# ⚠️ WHY hex FOR THE PASSWORDS. internal/config decodes the keys with
# base64.StdEncoding and demands exactly 32 bytes, so those three must be base64.
# The passwords go inside a URI (postgres://user:PASSWORD@host/db), where base64's
# `+` `/` `=` are reserved characters that a URL parser will either reject or
# silently mis-read as a delimiter. Hex has no reserved character, so the DSN can be
# assembled by pasting. This is not fussiness: a `/` in a password produces a DSN
# that parses into a DIFFERENT host, and the failure looks like a network problem.
#
# ⚠️ TAPPA_INVITE_HMAC_KEY MUST NOT EQUAL TAPPA_SESSION_HMAC_KEY. config.Load
# refuses the deployment if they match (constant-time compare), because the
# realistic operational failure is a copy-pasted value and it is invisible in every
# other way: the app boots, activation works, sessions work, and the independence
# the deployment believes it has is simply absent.
#
# ⚠️ THE PASSWORDS APPEAR TWICE AND MUST AGREE. POSTGRES_PASSWORD is what initdb
# gives tappa_owner and DATABASE_MIGRATE_URL is how goose connects as it;
# TAPPA_APP_PASSWORD is what the init script gives tappa_app and DATABASE_URL is how
# the server connects as it. Assemble the two URLs from the two passwords, do not
# generate them separately.
#
# ⚠️ AND initdb RUNS ONCE. These two passwords are consumed only while the Postgres
# volume is EMPTY. Changing POSTGRES_PASSWORD in this Secret later does NOT change
# the role's password — that takes an ALTER ROLE. deploy/README.md has the rotation
# steps.
# ----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  # 🔴 NOT the live name. Change it to `tappa-secrets` in your filled copy.
  name: tappa-secrets-example-do-not-apply
  namespace: tappa
  labels:
    app.kubernetes.io/name: tappa
type: Opaque
stringData:
  # --- what the SERVER pod is given (and nothing else) ---
  # tappa_app: NOBYPASSRLS, NOSUPERUSER, not the table owner. Every one of its
  # queries is subject to RLS. sslmode=disable is honest here and not a shortcut:
  # this connection never leaves the node's own bridge (single-node cluster, pod to
  # pod on cni0), and postgres:17-alpine ships with SSL off. A managed instance
  # elsewhere would need verify-full and the CA bundle is already in the image.
  DATABASE_URL: "postgres://tappa_app:REPLACE_APP_PASSWORD@tappa-postgres:5432/tappa?sslmode=disable"
  # 32 bytes, base64. openssl rand -base64 32
  TAPPA_SESSION_HMAC_KEY: "REPLACE_ME"
  # Wraps every plaque's NTAG AES key. Leaking this is leaking the whole park.
  TAPPA_TAG_KEK: "REPLACE_ME"
  # Generated SEPARATELY from the session key; config.Load refuses them equal.
  TAPPA_INVITE_HMAC_KEY: "REPLACE_ME"

  # --- what only the MIGRATION Job is given ---
  # 🔴 THIS KEY IS NEVER MOUNTED INTO THE SERVER POD, and that is the mechanism
  # behind M8-02's "uygulama ASLA migration rolüyle bağlanmıyor". 20-app.yaml lists
  # its four environment variables one by one with secretKeyRef rather than pulling
  # the whole Secret in with envFrom, so this value is not present in the server
  # process's environment at all — a compromised server process has nothing to read
  # and nothing to dial. tappa_owner is the schema owner and initdb's bootstrap
  # SUPERUSER: it bypasses RLS unconditionally, so a server holding it would void
  # tenant isolation completely (CLAUDE.md §4.5, ADR 0002).
  #
  # (internal/config only ever COMPARES this variable, to refuse a deployment where
  # the two DSNs are equal. Measured 2026-08-15: with DATABASE_MIGRATE_URL unset the
  # comparison is skipped and the server boots normally — see this task's report.)
  DATABASE_MIGRATE_URL: "postgres://tappa_owner:REPLACE_OWNER_PASSWORD@tappa-postgres:5432/tappa?sslmode=disable"

  # --- what only the POSTGRES pod is given ---
  # tappa_owner's password, consumed by initdb on FIRST start only.
  POSTGRES_PASSWORD: "REPLACE_OWNER_PASSWORD"
  # tappa_app's password, consumed by postgres-init/02-app-password.sh on FIRST
  # start only. Must match the password inside DATABASE_URL above.
  TAPPA_APP_PASSWORD: "REPLACE_APP_PASSWORD"
