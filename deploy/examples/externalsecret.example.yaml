# Tappa — the RECOMMENDED way to deliver the Secret (M8-02). EXAMPLE, NOT APPLIED.
#
# 🔴 RECOMMENDATION: USE THIS INSTEAD OF secret.example.yaml, and the reason is
# not tidiness — it is that the plain-Secret route makes a human hold TAPPA_TAG_KEK
# in a file. That key unwraps every plaque's NTAG AES key in the park (CLAUDE.md
# §4.7), and the plain route has it pass through a laptop's filesystem, a shell
# history and a terminal scrollback on its way to the cluster. external-secrets
# removes every one of those hops: the value is typed once into Infisical's UI and
# the cluster fetches it over an in-cluster address.
#
# ⚠️ IT IS A RECOMMENDATION AND NOT A PREREQUISITE. Nothing else in deploy/k8s/
# depends on which route created `tappa-secrets`; the Deployment, the Job and the
# StatefulSet reference the Secret by name and do not care. Start with the plain
# Secret if that is faster, and switch later — the switch is applying this file and
# deleting the hand-made Secret, in that order.
#
# ---------------------------------------------------------------------------
# WHAT WAS MEASURED IN THIS CLUSTER (2026-08-15), because the brief said three
# stores and there are seven:
#
#   $ kubectl get clustersecretstore
#   infisical-malta-lex · infisical-optiway-prod · infisical-optiway-staging
#   infisical-paychain-prod · infisical-paychain-staging · infisical-prod
#   infisical-xirigo-staging          — all Valid, ReadOnly, Ready
#
#   $ kubectl get clustersecretstore infisical-prod -o yaml
#   provider.infisical.secretsScope: projectSlug=shared-infra environmentSlug=prod
#                                    secretsPath=/ recursive=true
#
# `infisical-prod` is the general-purpose store and is already how other
# applications on this cluster take their own secrets — crypto-tracker's
# ExternalSecret pulls `/crypto-tracker/EXCHANGERATE_API_KEY` from it, which is the
# convention this file copies with `/tappa/...`.
#
# ---------------------------------------------------------------------------
# WHAT THE OPERATOR DOES FIRST (this file cannot do it, and should not):
#
#  1. In Infisical, project `shared-infra`, environment `prod`, create folder
#     `/tappa` and add these seven secrets. Generate them with, and only with:
#         openssl rand -base64 32   for the three 32-byte keys
#         openssl rand -hex 32      for the two database passwords
#     (Why hex for passwords: they go inside a URI and base64's + / = are reserved
#     characters there. secret.example.yaml carries the full argument.)
#
#        TAPPA_SESSION_HMAC_KEY   base64, 32 bytes
#        TAPPA_TAG_KEK            base64, 32 bytes
#        TAPPA_TAG_KEK_PREVIOUS   base64, 32 bytes -- ONLY while rotating the KEK
#        TAPPA_INVITE_HMAC_KEY    base64, 32 bytes — MUST differ from the session key
#        POSTGRES_PASSWORD        hex, tappa_owner
#        TAPPA_APP_PASSWORD       hex, tappa_app
#        DATABASE_URL             postgres://tappa_app:<TAPPA_APP_PASSWORD>@tappa-postgres:5432/tappa?sslmode=disable
#        DATABASE_MIGRATE_URL     postgres://tappa_owner:<POSTGRES_PASSWORD>@tappa-postgres:5432/tappa?sslmode=disable
#
#     (The two URLs repeat the two passwords. Infisical's secret references would
#     let them be composed instead — expandSecretReferences is true on this store —
#     but a reference that silently fails to expand produces a DSN with the literal
#     text in it and a login failure nobody can read. Two plain values that must
#     agree is the smaller hazard, and secret.example.yaml says so too.)
#
#  2. kubectl apply -f deploy/examples/externalsecret.example.yaml
#  3. kubectl -n tappa get externalsecret tappa-secrets   # STATUS must be SecretSynced
#
# ⚠️ refreshInterval DOES NOT RESTART ANYTHING. A rotated key in Infisical reaches
# the Kubernetes Secret within the hour and reaches the RUNNING PROCESS never —
# environment variables are read once at exec. Rotation is a rollout:
#     kubectl -n tappa rollout restart deployment/tappa
# (This cluster runs `reloader`, which can do that automatically; wiring it up is a
# deliberate choice and is not made here.)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  # 🔴 NOT THE LIVE NAME, for the same reason secret.example.yaml is not (audit B9).
  # `kubectl apply -f deploy/ -R` listed 11 objects and this was one of them; with
  # creationPolicy: Owner and target.name: tappa-secrets it would have TAKEN OVER the
  # live Secret and replaced its contents with whatever /tappa/* held at that moment
  # -- which, before Infisical is populated, is nothing.
  #
  # Change BOTH this name and spec.target.name to `tappa-secrets` in your real copy.
  name: tappa-secrets-example-do-not-apply
  namespace: tappa
  labels:
    app.kubernetes.io/name: tappa
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-prod
  target:
    # 🔴 CHANGE THIS TO `tappa-secrets` -- it is the name every manifest in
    # deploy/k8s/ references. It is deliberately wrong here so that applying the
    # UNEDITED example cannot take ownership of the live Secret.
    name: tappa-secrets-example-do-not-apply
    creationPolicy: Owner
    # Retain: deleting this ExternalSecret must not delete the credentials the
    # database and the running server are using.
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: /tappa/DATABASE_URL
    - secretKey: DATABASE_MIGRATE_URL
      remoteRef:
        key: /tappa/DATABASE_MIGRATE_URL
    - secretKey: TAPPA_SESSION_HMAC_KEY
      remoteRef:
        key: /tappa/TAPPA_SESSION_HMAC_KEY
    - secretKey: TAPPA_TAG_KEK
      remoteRef:
        key: /tappa/TAPPA_TAG_KEK
    # ONLY DURING A KEK ROTATION (deploy/README.md -> "KEK dondurme"). Carries the
    # OLD KEK so a half-rotated park stays readable; 20-app.yaml marks it optional
    # so the steady state can omit it. Removing it again IS the rotation -- while
    # it is present the leaked key still opens rows.
    # ⚠️ ExternalSecret has no per-key "optional": if this block is uncommented the
    # remote path must EXIST or the whole ExternalSecret stops syncing, which would
    # freeze every other key too. Uncomment it when the rotation starts, comment it
    # out (and delete the remote value) when step 3 is done.
    # - secretKey: TAPPA_TAG_KEK_PREVIOUS
    #   remoteRef:
    #     key: /tappa/TAPPA_TAG_KEK_PREVIOUS
    - secretKey: TAPPA_INVITE_HMAC_KEY
      remoteRef:
        key: /tappa/TAPPA_INVITE_HMAC_KEY
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /tappa/POSTGRES_PASSWORD
    - secretKey: TAPPA_APP_PASSWORD
      remoteRef:
        key: /tappa/TAPPA_APP_PASSWORD
