# Proje adi DOSYADA DECLARE EDILIR, dizin adindan TURETILMEZ. Sebep:
# scripts/db-reset.sh `-p tappa` ile hedefini sabitliyor (o dosyanin basligindaki
# olcum), ve bu ad dizin adina baglı kalsaydi checkout dizinini yeniden
# adlandirmak db-reset'i baska bir projeye — yani `make up`'in kurdugundan BASKA
# bir volume'e — dogrultacakti. Olculdu: bu makinede dizin zaten `tappa`, bu
# yuzden satir mevcut projeyi/volume'u DEGISTIRMEZ (`docker compose ls` -> tappa).
# Onceligi hatirlat: -p bayragi > COMPOSE_PROJECT_NAME > bu satir > dizin adi.
name: tappa

services:
  db:
    image: postgres:17-alpine
    container_name: tappa-db
    environment:
      POSTGRES_USER: tappa_owner
      POSTGRES_PASSWORD: tappa
      POSTGRES_DB: tappa
      # Determinizm: testler ve raporlar UTC uzerinden calisir.
      TZ: UTC
      PGTZ: UTC
    command: >
      postgres
      -c log_statement=all
      -c log_min_duration_statement=0
    ports:
      - "5432:5432"
    volumes:
      - tappa-pgdata:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tappa_owner -d tappa"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  tappa-pgdata:
