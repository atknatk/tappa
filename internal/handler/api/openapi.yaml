openapi: 3.1.0
info:
  title: Taptime integration API
  version: "1"
  description: |
    The integration API of Taptime (punchless time and attendance). A business's HR or ERP system
    writes the business's own locations and employees and reads its punches.

    Authentication: every request but this document carries `Authorization: Bearer <key>`, a key
    the business's owner issues in the Taptime panel. The API must also be enabled for the business
    by Taptime; until then a valid key is answered 403 `api_disabled`.

    Errors: every refusal is a JSON body `{code, message, details}` (the `Error` schema). A 429
    carries `Retry-After` (seconds). Request bodies are limited to 65536 bytes and are not accepted
    compressed.

    Idempotency: a write may carry `Idempotency-Key` (1-255 visible ASCII characters). A retry with
    the same key and the same request within 24 hours returns the first request's result without
    doing the work again (with `Idempotent-Replayed: true`); the same key with a different request
    is 422 `idempotency_key_reused`. Concurrent requests with one key are answered one after the
    other.

    Identifiers: `emp_`, `loc_`, `pch_` and `dlv_` followed by a UUID; `tag_` followed by the plaque's UID.
servers:
  - url: https://api.taptime.mt
security:
  - bearer: []
paths:
  /v1/openapi.yaml:
    get:
      operationId: getOpenAPI
      summary: This document.
      security: []
      responses:
        "200":
          description: The OpenAPI 3.1 document of this API.
          content:
            application/yaml:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/locations/{ref}:
    put:
      operationId: putLocation
      summary: Create or update one of the business's locations by its external reference.
      description: |
        The location is addressed by the business's own reference (`ref`). An unknown reference
        creates a location (201); a known one is renamed and relabelled (200); a request that
        matches the location as it is changes nothing (200). A location is never matched by its
        name: to update a location that already exists in Taptime, its owner first sets its
        "External ref" in the Taptime panel.

        Only the name and the `active` label are written. `active` is a label and changes nothing
        about how taps there are judged. Address ranges and the coordinate that prove a tap
        happened at the location are set in the Taptime panel only: until they are, every tap at a
        location created here is recorded and waits for a manager's approval.

        A location has no time zone of its own: `timezone`, when sent, must be the business's
        (422 `timezone_mismatch` otherwise, naming the business's zone).

        The body is one UTF-8 JSON object with exactly the fields below, each at most once: any
        other field is 422 `validation_failed` (`details.reason` `unknown_field`) and a field named
        twice is 422 (`duplicate_field`). The reference may be percent-encoded; it is decoded once
        and must then match the pattern (so `%41BC` is `ABC`, and an encoded `/` is refused). While
        the business is suspended this endpoint is 403 `tenant_suspended`.
      parameters:
        - name: ref
          in: path
          required: true
          description: The business's reference for the location.
          schema:
            $ref: "#/components/schemas/ExternalRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationPut"
      responses:
        "200":
          description: The location existed; it is now as sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "201":
          description: The location was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An integration key, `tt_live_` followed by 43 base64url characters.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Makes a write safe to retry for 24 hours.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: "^[!-~]{1,255}$"
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 500
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
  schemas:
    ExternalRef:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9][A-Za-z0-9._~-]{0,63}$"
    LocationPut:
      type: object
      additionalProperties: false
      required: [name, active]
      properties:
        name:
          type: string
          description: |
            1 to 80 characters once surrounding spaces are removed (they are removed). Emoji, flags and
            every script's letters are accepted. A soft hyphen, the direction marks U+200E, U+200F and
            U+061C and a byte-order mark at either end are removed. A NEW or CHANGED name cannot carry
            a control character, a line or paragraph separator (U+2028, U+2029), a direction override
            or isolate (U+202A-U+202E, U+2066-U+2069), a zero-width space (U+200B), a word joiner
            (U+2060) or an inner U+FEFF, nor a joiner (U+200C, U+200D) that is not between two visible
            characters or a tag character (U+E0020-U+E007F) outside a flag (422 validation_failed,
            details.reason hidden_character); a name already on file is accepted as it is.
        active:
          type: boolean
          description: A label. It does not change how taps at the location are judged.
        timezone:
          type: string
          minLength: 1
          description: Optional. When present it must be the business's time zone.
        externalRef:
          type: string
          description: Optional. When present it must be the reference in the path.
    Location:
      type: object
      additionalProperties: false
      required: [id, externalRef, name, timezone, active, createdAt]
      properties:
        id:
          type: string
          pattern: "^loc_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        externalRef:
          $ref: "#/components/schemas/ExternalRef"
        name:
          type: string
        timezone:
          type: string
          description: The business's time zone (a location has none of its own).
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
          enum: [invalid_request, body_too_large, unauthorized, api_disabled, tenant_suspended, not_found, idempotency_key_reused, validation_failed, timezone_mismatch, rate_limited, unavailable]
        message:
          type: string
          description: A sentence for a person. Never contains the request's own values.
        details:
          type: object
          description: Machine-readable specifics, such as the parameter at fault; may be empty.
  responses:
    BadRequest:
      description: "invalid_request or body_too_large: a parameter, header or body the contract refuses."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "unauthorized: no key, or a key that is not valid."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "api_disabled: the API is not enabled for this business; tenant_suspended: the business is suspended and this change is not accepted."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "not_found: no such resource (on an Idempotency-Key replay: the location it recorded no longer exists)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: "idempotency_key_reused: the Idempotency-Key was used with a different request; validation_failed: a field or the path's reference the contract refuses (details.field and details.reason -- required, type, invalid, hidden_character, mismatch, unknown_field, duplicate_field); timezone_mismatch: a location's time zone must be its business's (details.businessTimezone)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: "rate_limited: wait for Retry-After seconds."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: "unavailable: the request could not be completed on our side; retry."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
