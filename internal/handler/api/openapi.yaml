openapi: 3.1.0
info:
  title: Taptime integration API
  version: "1"
  description: |
    The integration API of Taptime (punchless time and attendance). A business's HR or ERP system
    writes the business's own locations and employees and reads its punches and its directory; a
    webhook tells it of a punch as it happens.

    The integration guide explains the whole contract in prose, with the story these examples come
    from: GET /v1/guide.md (English) and GET /v1/guide.tr.md (Turkish), on this host, without a key.

    Authentication: every request but the three documents carries `Authorization: Bearer <key>`, a
    key the business's owner issues in the Taptime panel. The API must also be enabled for the
    business by Taptime; until then a valid key is answered 403 `api_disabled`. The key's business is
    the only business a request reads or writes -- no request names a business.

    Errors: every refusal is a JSON body `{code, message, details}` (the `Error` schema). Each
    operation lists the codes it can answer in `x-error-codes`. A 429 carries `Retry-After`
    (seconds). Request bodies are limited to 65536 bytes and are not accepted compressed.

    Rate limits (`x-limits`): per client address 1200 requests a minute -- the documents and every
    request with a well-formed key, counted before the key is looked up -- and per key 600 a minute;
    over either, 429 `rate_limited` with `Retry-After`. No other rate-limit header is sent.
    Deactivations have a budget of their own (20 per key per hour, 429 `deactivation_budget_exceeded`).

    Idempotency: a write may carry `Idempotency-Key` (1-255 visible ASCII characters). A retry with
    the same key and the same request within 24 hours returns the first request's result without
    doing the work again (with `Idempotent-Replayed: true`); the same key with a different request
    is 422 `idempotency_key_reused`. "The same request" is byte for byte: the method, the path as
    sent (its percent-encoding included), the query string as sent and the body's bytes -- another
    order of query parameters or other whitespace in the JSON is a different request; headers are
    not part of it. Concurrent requests with one key are answered one after the other. Keys are kept
    per integration key: two keys of one business do not share them.

    Query parameters: a GET takes exactly its documented parameters (any other, a repeated one, or
    a query string that does not parse, is 400). A write takes none and ignores any it is sent:
    there is no `dryRun` or the like -- a PUT sent with `?dryRun=1` is a real write.

    Identifiers: `emp_`, `loc_`, `pch_` and `dlv_` followed by a UUID; `tag_` followed by the plaque's
    UID. Instants are RFC 3339 in UTC with at most microsecond precision.
  x-limits:
    requestsPerAddressPerMinute: 1200
    requestsPerKeyPerMinute: 600
    deactivationsPerKeyPerHour: 20
    maxBodyBytes: 65536
    defaultPageSize: 500
    maxPageSize: 1000
    idempotencyHours: 24
    requestTimeoutSeconds: 30
    feedWindowPositions: 10000
    historyMaxHours: 745
    directoryOverlapMinutes: 10
    webhookTimeoutSeconds: 10
    webhookAttempts: 6
    webhookTestMessagesPerHour: 10
    invitesPerBusinessPerHour: 50
    invitesPerBusinessPerDay: 300
    invitesPerEmployeePerHour: 3
    invitationQueueHours: 72
    invitationSendAttempts: 5
servers:
  - url: https://api.taptime.mt
security:
  - bearer: []
paths:
  /v1/openapi.yaml:
    get:
      operationId: getOpenAPI
      summary: This document.
      description: Served without a key, metered by the client address. Its answer is not cached (`Cache-Control` `no-store`). It takes no query parameter -- any, and a query string that does not parse, is 400 (`details.allowed` empty).
      security: []
      x-error-codes: [invalid_request, body_too_large, rate_limited]
      responses:
        "200":
          description: The OpenAPI 3.1 document of this API.
          content:
            application/yaml:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/guide.md:
    get:
      operationId: getGuide
      summary: The integration guide, in English.
      description: |
        The integration guide (Markdown, English -- the original). Served without a key, metered by
        the client address like this document. Revalidate a copy with `If-None-Match`: an unchanged
        guide answers 304 without a body. It takes no query parameter -- any is 400 (`details.allowed`
        empty).
      security: []
      x-error-codes: [invalid_request, body_too_large, rate_limited]
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          $ref: "#/components/responses/Guide"
        "304":
          $ref: "#/components/responses/GuideNotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/guide.tr.md:
    get:
      operationId: getGuideTurkish
      summary: The integration guide, in Turkish.
      description: The guide's Turkish translation -- the same document, section by section. Served like `/v1/guide.md` (no query parameter).
      security: []
      x-error-codes: [invalid_request, body_too_large, rate_limited]
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          $ref: "#/components/responses/Guide"
        "304":
          $ref: "#/components/responses/GuideNotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/locations/{ref}:
    put:
      operationId: putLocation
      summary: Create or update one of the business's locations by its external reference.
      description: |
        The location is addressed by the business's own reference (`ref`). An unknown reference
        creates a location (201); a known one is renamed and relabelled (200); a request that
        matches the location as it is changes nothing (200). A location is never matched by its
        name: to update a location that already exists in Taptime, its owner first sets its
        "External ref" in the Taptime panel. (A KM department is a location.)

        Only the name and the `active` label are written. `active` is a label and changes nothing
        about how taps there are judged. Address ranges and the coordinate that prove a tap
        happened at the location are set in the Taptime panel only: until they are, every tap at a
        location created here is recorded and waits for a manager's approval.

        A location has no time zone of its own: `timezone`, when sent, must be the business's
        (422 `timezone_mismatch` otherwise, naming the business's zone).

        The body is one UTF-8 JSON object with exactly the fields below, each at most once: any
        other field is 422 `validation_failed` (`details.reason` `unknown_field`) and a field named
        twice is 422 (`duplicate_field`). The reference may be percent-encoded; it is decoded once
        and must then match the pattern (so `%41BC` is `ABC`, and an encoded `/` is refused). While
        the business is suspended this endpoint is 403 `tenant_suspended`.

        A PUT sends the whole location: `name` and `active` every time. Its two optional fields hold
        nothing of their own (`timezone` is the business's, `externalRef` the path's), so leaving
        them out changes nothing.
      x-error-codes: [invalid_request, body_too_large, unauthorized, api_disabled, tenant_suspended, not_found, idempotency_key_reused, validation_failed, timezone_mismatch, rate_limited, unavailable]
      parameters:
        - $ref: "#/components/parameters/LocationRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationPut"
            examples:
              valletta:
                summary: KF puts its location KF-VLT.
                value: {"name": "Valletta", "active": true, "timezone": "Europe/Malta"}
      responses:
        "200":
          description: The location existed; it is now as sent.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "201":
          description: The location was created.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
              examples:
                valletta:
                  summary: The answer to the request above.
                  value: {"id": "loc_30258476-2ce5-4a5d-a7dd-36651c3019dd", "externalRef": "KF-VLT", "name": "Valletta",
                    "timezone": "Europe/Malta", "active": true, "createdAt": "2026-10-16T09:13:12.861739Z"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/employees:
    get:
      operationId: listEmployees
      summary: A page of the business's employees.
      description: |
        Every employee of the business -- active and deactivated, with or without an external
        reference -- in a stable order, `limit` at a time (default 500, at most 1000). When a page is
        full, `nextCursor` names the next one; pass it as `cursor` (a page with fewer than `limit`
        employees is the last, and its `nextCursor` is null). No other query parameter is accepted,
        each at most once, and a query string that does not parse is 400 too. No answer carries an e-mail address: `hasEmail` says whether there is one,
        `activationEmail` the activation e-mail's state and time.
      x-error-codes: [invalid_request, body_too_large, unauthorized, api_disabled, rate_limited, unavailable]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the previous page.
          schema:
            type: string
            pattern: "^emp_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeePage"
              examples:
                kf:
                  summary: KF's employees, two a page (E-1043 was deactivated).
                  value: {"data": [
                      {"id": "emp_8973fbc8-5e76-48e2-a80b-67d5b10baa91", "externalRef": "E-1042", "employeeCode": "1042",
                        "firstName": "Jane", "lastName": "Example", "fullName": "Jane Example", "active": true,
                        "activated": false, "activatedAt": null, "hasEmail": true,
                        "activationEmail": {"status": "queued", "at": "2026-10-16T09:13:12.905861Z"},
                        "createdAt": "2026-10-16T09:13:12.891784Z", "updatedAt": "2026-10-16T09:13:12.902916Z"},
                      {"id": "emp_32a024b8-e86f-4110-a4da-c05ee0acd9b7", "externalRef": "E-1043", "employeeCode": null,
                        "firstName": "Sam", "lastName": "Placeholder", "fullName": "Sam Placeholder", "active": false,
                        "activated": false, "activatedAt": null, "hasEmail": false,
                        "activationEmail": {"status": "none", "at": null},
                        "createdAt": "2026-10-16T09:13:12.918861Z", "updatedAt": "2026-10-16T09:13:12.95631Z"}],
                    "nextCursor": "emp_32a024b8-e86f-4110-a4da-c05ee0acd9b7"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/employees/{ref}:
    get:
      operationId: getEmployee
      summary: One employee, by the business's reference.
      description: |
        The active employee under the reference, or -- when none is active -- the most recently
        deactivated one (a re-hire is a new employee under the same reference). 404 when the business
        never held the reference. No e-mail address is answered. It takes no query parameter -- any
        is 400 (`details.allowed` empty).
      x-error-codes: [invalid_request, body_too_large, unauthorized, api_disabled, not_found, validation_failed, rate_limited, unavailable]
      parameters:
        - $ref: "#/components/parameters/EmployeeRef"
      responses:
        "200":
          description: The employee.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
              examples:
                jane:
                  summary: E-1042, invited and not activated yet.
                  value: {"id": "emp_8973fbc8-5e76-48e2-a80b-67d5b10baa91", "externalRef": "E-1042", "employeeCode": "1042",
                    "firstName": "Jane", "lastName": "Example", "fullName": "Jane Example", "active": true,
                    "activated": false, "activatedAt": null, "hasEmail": true,
                    "activationEmail": {"status": "queued", "at": "2026-10-16T09:13:12.905861Z"},
                    "createdAt": "2026-10-16T09:13:12.891784Z", "updatedAt": "2026-10-16T09:13:12.902916Z"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      operationId: putEmployee
      summary: Create, update or deactivate one of the business's employees by its external reference.
      description: |
        The employee is addressed by the business's own reference (`ref`).

        An unknown reference first BINDS an employee the business already has in Taptime: an active
        employee with no reference whose e-mail address is the one sent (in this business only).
        Otherwise it creates a new employee (201) and, when `email` is an address, queues an
        activation e-mail: the activation link is created when the e-mail is sent (`activationEmail`
        is `queued`, then `sent`). The e-mail is sent within Taptime's sending limits; reaching a limit
        delays it, it never refuses the request. The employee activates by opening the link and then
        tapping a plaque of the business; that first tap is not a punch.

        A known reference is updated (200). When the e-mail address changes, every activation link
        sent to the old one stops working, in the same change; an employee who has not activated yet
        is sent a new one, an activated employee is not. `active: false` deactivates the employee
        (their taps are refused from then on); `active: false` on a reference the business never held
        is 404, while the business is suspended too (it lands on no employee). `active: true` on a reference whose employee is deactivated creates a NEW employee (new
        `id`, same `externalRef`). A request that matches the employee as they are changes nothing
        (200).

        A PUT replaces, it does not patch: a left-out `employeeCode` becomes null -- an employee
        whose `employeeCode` was "77", put without the field, is answered with `employeeCode` null,
        and so are their next punches and a partner's directory. Send every field you hold, every
        time. (`externalRef`, the other optional field, holds nothing of its own: left out, it is the
        path's reference.)

        `email` must be one plain ASCII address and not the address of an administrator of the
        business (422 `administrator_address`); an address another active employee of the business
        holds is 409 `email_unavailable` (nothing is created or sent). These answers tell the key's
        holder whose an address is inside its own business, and nothing of any other business.

        Deactivation -- here or by DELETE -- is limited per key: past 20 in an hour it is 429
        `deactivation_budget_exceeded` with `Retry-After`, and the business's owner is alerted.

        The body is one UTF-8 JSON object with exactly the fields below, each at most once (any other
        field 422 `unknown_field`, a field twice 422 `duplicate_field`). While the business is
        suspended a request that creates a new employee (a re-hire included) is accepted; every
        request that lands on an existing employee -- a change, a binding by address, `active: false`
        (also on an employee already deactivated) and one that changes nothing -- is 403
        `tenant_suspended`.
      x-error-codes: [invalid_request, body_too_large, unauthorized, api_disabled, tenant_suspended, not_found, email_unavailable, idempotency_key_reused, validation_failed, rate_limited, deactivation_budget_exceeded, unavailable]
      parameters:
        - $ref: "#/components/parameters/EmployeeRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeePut"
            examples:
              jane:
                summary: KF puts its employee E-1042.
                value: {"firstName": "Jane", "lastName": "Example", "email": "jane.example@example.com", "active": true,
                  "employeeCode": "1042"}
      responses:
        "200":
          description: The employee existed (or was bound by address); it is now as sent.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "201":
          description: A new employee was created.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
              examples:
                jane:
                  summary: The answer to the request above -- the activation e-mail is queued.
                  value: {"id": "emp_8973fbc8-5e76-48e2-a80b-67d5b10baa91", "externalRef": "E-1042", "employeeCode": "1042",
                    "firstName": "Jane", "lastName": "Example", "fullName": "Jane Example", "active": true,
                    "activated": false, "activatedAt": null, "hasEmail": true,
                    "activationEmail": {"status": "queued", "at": "2026-10-16T09:13:12.905861Z"},
                    "createdAt": "2026-10-16T09:13:12.891784Z", "updatedAt": "2026-10-16T09:13:12.902916Z"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteEmployee
      summary: Deactivate one of the business's employees.
      description: |
        Deactivates the active employee under the reference: their taps are refused from then on, and
        their history stays. An employee already deactivated is answered as they are (200, nothing
        spent); a reference the business never held is 404. Limited per key like `active: false` (429
        `deactivation_budget_exceeded`). While the business is suspended every DELETE is 403
        `tenant_suspended` -- one of an employee already deactivated, and one of a reference the
        business never held, too.
      x-error-codes: [invalid_request, body_too_large, unauthorized, api_disabled, tenant_suspended, not_found, idempotency_key_reused, validation_failed, rate_limited, deactivation_budget_exceeded, unavailable]
      parameters:
        - $ref: "#/components/parameters/EmployeeRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The employee, deactivated.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
              examples:
                sam:
                  summary: E-1043 (no e-mail address) deactivated.
                  value: {"id": "emp_32a024b8-e86f-4110-a4da-c05ee0acd9b7", "externalRef": "E-1043", "employeeCode": null,
                    "firstName": "Sam", "lastName": "Placeholder", "fullName": "Sam Placeholder", "active": false,
                    "activated": false, "activatedAt": null, "hasEmail": false,
                    "activationEmail": {"status": "none", "at": null},
                    "createdAt": "2026-10-16T09:13:12.918861Z", "updatedAt": "2026-10-16T09:13:12.95631Z"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/employees/{ref}/resend-activation:
    post:
      operationId: resendActivation
      summary: Ask for the activation e-mail to be sent again.
      description: |
        Queues an activation e-mail for an employee who has not activated. It never cancels a link at
        request time: while an e-mail is already queued, or one was sent in the last hour and its link
        still works, the request changes nothing -- the answer is 202 either way. The new link, when
        one is sent, replaces the older ones. An activated employee is 409 `already_activated` (a new
        phone is set up in the Taptime panel); an employee with no e-mail address is 422. Accepted
        while the business is suspended.
      x-error-codes: [invalid_request, body_too_large, unauthorized, api_disabled, not_found, already_activated, idempotency_key_reused, validation_failed, rate_limited, unavailable]
      parameters:
        - $ref: "#/components/parameters/EmployeeRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Accepted; `activationEmail` says the state.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
              examples:
                jane:
                  summary: An e-mail is already queued for E-1042, so nothing changes -- still 202.
                  value: {"id": "emp_8973fbc8-5e76-48e2-a80b-67d5b10baa91", "externalRef": "E-1042", "employeeCode": "1042",
                    "firstName": "Jane", "lastName": "Example", "fullName": "Jane Example", "active": true,
                    "activated": false, "activatedAt": null, "hasEmail": true,
                    "activationEmail": {"status": "queued", "at": "2026-10-16T09:13:12.905861Z"},
                    "createdAt": "2026-10-16T09:13:12.891784Z", "updatedAt": "2026-10-16T09:13:12.902916Z"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/punches:
    get:
      operationId: listPunches
      summary: A page of the business's punches -- its feed, or (with from and to) a history range.
      description: |
        The business's punch feed: every punch that counts -- an `ok` tap (`nfc` or `qr`), or a
        flagged tap once a manager of the employer approves it (it enters the feed at the approval,
        once). A manual record, a practice tap, a refused tap, an ignored repeat (the same person
        within 60 seconds, in the declared instants or on Taptime's own clock, whichever is closer)
        and a rejected flag never enter it. Punches are read in the order the business's feed received them; a punch's
        `id` and `version` identify it (it is never changed in v1: `version` 1, `status` `valid`).

        `scope` is required. `employer`: the punches of this business's own employees, at its own
        locations and at a partner company's in the same group (there `location` names the partner's
        location). `location`: every punch at this business's locations, a partner company's
        employees' included (there `employee` names the partner's employee). A punch at a business's
        own location by its own employee is in both. Working time computed from `scope=location`
        alone can be too long for a partner's employee: their punches elsewhere are not in it -- use
        the employer's `employer` scope for working time.

        Paging: pass the previous page's `nextCursor` as `cursor` (none: from the beginning).
        `nextCursor` is always present -- on an empty page too, where it is the position this reader
        has caught up to -- and never goes back. A page can hold fewer punches than `limit`, even
        none, while `hasMore` is true (a page reads at most 10000 positions of the feed); read on while
        it is. `hasMore` false: every punch the feed held when the page was read has been answered;
        poll again later with `nextCursor`. A cursor is a position in this business's feed -- one feed
        for both scopes; a position past the feed's end is refused (400). Keep a separate
        `nextCursor` for each scope you read, and do not carry a cursor to another business: a cursor
        taken to the other scope, or to another business inside its range, is not refused, and the
        events before it are skipped silently.

        History (`from` and `to`, together): the scope's punches whose `punchTime` is in [`from`,
        `to`) -- `from` before `to`, at most 31 days and one hour apart (a calendar month in any time
        zone, a daylight-saving change included); RFC 3339 instants (`YYYY-MM-DDThh:mm:ss`, an
        optional `.fraction`, then `Z` or an offset `±hh:mm`) with at most microsecond precision --
        anything else is 400; a `+` in an offset must be sent as `%2B` (unencoded it reads as a
        space: 400 with `details.reason` `unencoded_plus`) -- in `punchTime` order (ties in feed
        order). Page with `nextCursor` as with the feed; a history cursor (`hst_…`) belongs to the
        business, `scope`, `from` and `to` it was issued for and is 400 with any other, and so is a feed cursor
        (`cur_…`) sent with `from`/`to` or a history cursor sent without them. A history read is a
        SNAPSHOT: its first page fixes the feed position it stands at, and its pages answer the
        punches the feed held then. A punch that enters the feed later with an earlier `punchTime`
        -- a flag approved days after the tap, a phone's offline queue -- is not in that read, even
        inside its range; asking the same range again later can answer more. To receive every punch
        for certain, read the feed (`cursor` without `from`/`to`). Unlike a feed cursor, a history
        cursor cannot be carried to the other scope: it is bound to the one it was issued for.

        Only `scope`, `cursor`, `limit`, `from` and `to` are accepted, each at most once; any other
        parameter, and a query string that does not parse, is 400. No punch carries an e-mail address, a
        coordinate, a network address, a note or the reason of a decision. While the business is
        suspended this endpoint stays open.
      x-error-codes: [invalid_request, body_too_large, unauthorized, api_disabled, rate_limited, unavailable]
      parameters:
        - name: scope
          in: query
          required: true
          description: "employer: this business's employees' punches; location: every punch at this business's locations."
          schema:
            type: string
            enum: [employer, location]
        - name: cursor
          in: query
          required: false
          description: "The `nextCursor` of the previous page: `cur_…` for the feed, `hst_…` for a history read (with the same scope, from and to)."
          schema:
            type: string
            pattern: "^(cur_(0|[1-9][0-9]{0,18})|hst_(0|[1-9][0-9]{0,18})_-?(0|[1-9][0-9]{0,18})_(0|[1-9][0-9]{0,18})_[0-9a-f]{16})$"
        - name: from
          in: query
          required: false
          description: "History: the range's start (included), RFC 3339 with an offset, at most microsecond precision. Requires `to`."
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: "History: the range's end (excluded), at most 31 days and one hour after `from`. Requires `from`."
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunchPage"
              examples:
                feed:
                  summary: "KF's feed, scope=location: Joe (KM) and Jane (KF) tapped in at KF's Valletta."
                  value: {"data": [
                      {"id": "pch_00d216d4-3012-4d76-9c35-8f24028b432a", "version": 1, "status": "valid",
                        "punchTime": "2026-10-16T09:13:13.008183Z", "recordedAt": "2026-10-16T09:13:13.051707Z",
                        "channel": "nfc", "direction": "in",
                        "employee": {"id": "emp_42f028c7-242a-4903-89df-8fde6176926b", "externalRef": "M-2001",
                          "employeeCode": "2001", "company": "KM"},
                        "location": {"id": "loc_30258476-2ce5-4a5d-a7dd-36651c3019dd", "externalRef": "KF-VLT",
                          "name": "Valletta", "company": "KF"},
                        "tagId": "tag_0DD4F2FE3B9A6A"},
                      {"id": "pch_04ce3ad0-fb32-477d-9d5d-7c0e9b079b41", "version": 1, "status": "valid",
                        "punchTime": "2026-10-16T09:13:13.083662Z", "recordedAt": "2026-10-16T09:13:13.116875Z",
                        "channel": "nfc", "direction": "in",
                        "employee": {"id": "emp_8973fbc8-5e76-48e2-a80b-67d5b10baa91", "externalRef": "E-1042",
                          "employeeCode": "1042", "company": "KF"},
                        "location": {"id": "loc_30258476-2ce5-4a5d-a7dd-36651c3019dd", "externalRef": "KF-VLT",
                          "name": "Valletta", "company": "KF"},
                        "tagId": "tag_0DD4F2FE3B9A6A"}],
                    "nextCursor": "cur_2", "hasMore": false}
                history:
                  summary: "KM's history, scope=employer: Joe in at KF's Valletta, out at KM's Production."
                  value: {"data": [
                      {"id": "pch_00d216d4-3012-4d76-9c35-8f24028b432a", "version": 1, "status": "valid",
                        "punchTime": "2026-10-16T09:13:13.008183Z", "recordedAt": "2026-10-16T09:13:13.051707Z",
                        "channel": "nfc", "direction": "in",
                        "employee": {"id": "emp_42f028c7-242a-4903-89df-8fde6176926b", "externalRef": "M-2001",
                          "employeeCode": "2001", "company": "KM"},
                        "location": {"id": "loc_30258476-2ce5-4a5d-a7dd-36651c3019dd", "externalRef": "KF-VLT",
                          "name": "Valletta", "company": "KF"},
                        "tagId": "tag_0DD4F2FE3B9A6A"},
                      {"id": "pch_f01406af-dfcc-4fc0-bc4e-c3d982645fe8", "version": 1, "status": "valid",
                        "punchTime": "2026-10-16T09:14:14.253191Z", "recordedAt": "2026-10-16T09:14:14.261497Z",
                        "channel": "nfc", "direction": "out",
                        "employee": {"id": "emp_42f028c7-242a-4903-89df-8fde6176926b", "externalRef": "M-2001",
                          "employeeCode": "2001", "company": "KM"},
                        "location": {"id": "loc_4b6d2cc5-44e7-42c0-9830-abd1b8e370bb", "externalRef": "DEP-1",
                          "name": "Production", "company": "KM"},
                        "tagId": "tag_DF83F315A119DF"}],
                    "nextCursor": "hst_2_1792142054253191_2_4b83bfee122c0b1d", "hasMore": false}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/directory:
    get:
      operationId: listDirectory
      summary: A page of the employees this business may know of -- its own and its group partners'.
      description: |
        The directory: this business's own employees and, when it belongs to a group of companies
        in Taptime, the partner companies' employees -- each with its `company` code, `externalRef`,
        `employeeCode`, `firstName`, `lastName`, `fullName`, whether it is `active` (false:
        deactivated) and `updatedAt`. No entry carries an e-mail address. A business in no group reads its own
        employees only.

        Order and paging: entries come in (`updatedAt`, `id`) order. A WALK is the pages from a
        request without `cursor` to the page whose `hasMore` is false: pass the previous page's
        `nextCursor` as `cursor`, with the SAME `updatedSince` (or none) -- a cursor with another
        `updatedSince`, or from another business, is 400. `nextCursor` is present exactly when
        `hasMore` is true (null at the end of the walk).

        Incremental reads: `updatedSince` (RFC 3339, `Z` or an offset ±hh:mm, at most microsecond
        precision; a `+` must be sent as `%2B`, unencoded it reads as a space: 400 with
        `details.reason` `unencoded_plus`) answers the entries changed since then -- the server reads
        from 10 minutes before it, so a change whose write committed late is not missed. Every page
        carries the walk's `asOf`: when the walk ends, keep it and start the next walk with
        `updatedSince=asOf`. Expect entries you already have, within a walk too (an employee changed
        while you read moves to the end of the order): overwrite by `id`. A change is in a later walk
        unless the transaction that wrote it stayed open more than 10 minutes.

        Keyed by `id`: a re-hired person (an inactive entry and a new active one) can share an
        `externalRef`. Two changes reach no incremental read, because they change no employee: a
        company joining or leaving the group (an incremental read neither adds its staff nor says
        they are gone), and a company's `company` code changing (its employees keep the old code in
        an incremental read). Neither is signalled: read the whole directory (no `updatedSince`)
        periodically -- daily, for instance -- and after a group change you know of; incremental
        reads are for the changes in between.

        A `nextCursor` this server handed out can be refused (400) after the server's clock stepped
        back; retry the same request after a short, growing wait (seconds), and restart the walk with
        the same `updatedSince` if the refusal persists. Nothing is lost.

        Only `updatedSince`, `cursor` and `limit` are accepted, each at most once; any other
        parameter, and a query string that does not parse, is 400. While the business is suspended
        this endpoint stays open.
      x-error-codes: [invalid_request, body_too_large, unauthorized, api_disabled, rate_limited, unavailable]
      parameters:
        - name: updatedSince
          in: query
          required: false
          description: "The previous walk's `asOf` (none: the whole directory). The server reads from 10 minutes before it. A group membership change or a change of a company's `company` code is not in an incremental read -- read the whole directory periodically (daily, for instance)."
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          required: false
          description: "The `nextCursor` of the previous page of this walk, sent with the same `updatedSince`."
          schema:
            type: string
            pattern: "^dir_(0|[1-9][0-9]{0,18})_-?(0|[1-9][0-9]{0,18})_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}_[0-9a-f]{16}$"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryPage"
              examples:
                kf:
                  summary: KF's whole directory -- its two employees and KM's one.
                  value: {"data": [
                      {"id": "emp_32a024b8-e86f-4110-a4da-c05ee0acd9b7", "company": "KF", "externalRef": "E-1043",
                        "employeeCode": null, "firstName": "Sam", "lastName": "Placeholder", "fullName": "Sam Placeholder",
                        "active": false, "updatedAt": "2026-10-16T09:13:12.95631Z"},
                      {"id": "emp_8973fbc8-5e76-48e2-a80b-67d5b10baa91", "company": "KF", "externalRef": "E-1042",
                        "employeeCode": "1042", "firstName": "Jane", "lastName": "Example", "fullName": "Jane Example",
                        "active": true, "updatedAt": "2026-10-16T09:13:13.00516Z"},
                      {"id": "emp_42f028c7-242a-4903-89df-8fde6176926b", "company": "KM", "externalRef": "M-2001",
                        "employeeCode": "2001", "firstName": "Joe", "lastName": "Sample", "fullName": "Joe Sample",
                        "active": true, "updatedAt": "2026-10-16T09:13:13.006277Z"}],
                    "nextCursor": null, "hasMore": false, "asOf": "2026-10-16T09:14:14.298977Z"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
webhooks:
  punch:
    post:
      operationId: receivePunch
      summary: A punch, posted to the business's webhook endpoint as it enters the feed.
      description: |
        Taptime posts each punch of the business's feed -- in either scope -- to the business's one
        webhook endpoint, set up by its owner in the Taptime panel (not through this API). The body is
        the `GET /v1/punches` item with two fields more: `event` (`punch`) and `deliveryId` (`dlv_…`).
        A punch between two companies of one group is two deliveries, one to each company's endpoint.

        Signature: `X-Taptime-Signature` is `sha256=` and the lower-case hex HMAC-SHA256 of the
        body's exact bytes, keyed by the endpoint's signing key as text (`tt_whsec_…`, the prefix
        included). Recompute it over the raw body and compare in constant time; there is no timestamp
        header. The guide has a known-answer vector.

        Connection: TLS 1.2 or newer, and a certificate valid for the endpoint's name that chains to
        a publicly trusted certificate authority -- an older TLS, a self-signed certificate or a
        private authority's fails every try. Taptime presents no client certificate: a receiver that
        asks for one (mutual TLS) fails every try too.

        Answer: any 2xx within 10 seconds is "delivered". Anything else -- another status (a redirect
        included: it is not followed), no answer within 10 seconds, a TLS or connection failure -- is a
        failed try. A failed delivery is tried again after 1 min, 5 min, 30 min, 2 h and 6 h; the
        sixth failure makes it failed (`dead`), and it is not tried again unless the owner sends it
        again from the panel. Every try of one delivery carries the same `deliveryId` and the same
        bytes. A punch can arrive more than once and in any order: deduplicate by `id` + `version`.
        The feed is the record: punches recorded while the endpoint was off are never delivered.
      x-retry-schedule-seconds: [60, 300, 1800, 7200, 21600]
      parameters:
        - $ref: "#/components/parameters/Signature"
        - $ref: "#/components/parameters/WebhookUserAgent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunchDelivery"
            examples:
              jane:
                summary: Jane's punch in, posted to KF's endpoint.
                value: {"event": "punch", "deliveryId": "dlv_44721ce2-0f54-41ce-a757-7ee03cfec107",
                  "id": "pch_04ce3ad0-fb32-477d-9d5d-7c0e9b079b41", "version": 1, "status": "valid",
                  "punchTime": "2026-10-16T09:13:13.083662Z", "recordedAt": "2026-10-16T09:13:13.116875Z",
                  "channel": "nfc", "direction": "in",
                  "employee": {"id": "emp_8973fbc8-5e76-48e2-a80b-67d5b10baa91", "externalRef": "E-1042",
                    "employeeCode": "1042", "company": "KF"},
                  "location": {"id": "loc_30258476-2ce5-4a5d-a7dd-36651c3019dd", "externalRef": "KF-VLT",
                    "name": "Valletta", "company": "KF"},
                  "tagId": "tag_0DD4F2FE3B9A6A"}
      responses:
        "2XX":
          description: Delivered. The answer's body is not read.
        default:
          description: A failed try (as is no answer within 10 seconds); tried again on the schedule.
  ping:
    post:
      operationId: receivePing
      summary: A test message the business's owner sends from the Taptime panel.
      description: |
        A synthetic event with the same headers and the same signature as a punch. It names no punch,
        employee or location: tell it apart by `event` and do not count it as a punch. The owner can
        send ten an hour (the same ten that "send again now" spends).
      parameters:
        - $ref: "#/components/parameters/Signature"
        - $ref: "#/components/parameters/WebhookUserAgent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Ping"
            examples:
              ping:
                summary: A test message to KF's endpoint.
                value: {"event": "ping", "id": "25712ae0-7571-4f57-bb1a-d49b5c237b87", "sentAt": "2026-10-16T09:14:14Z"}
      responses:
        "2XX":
          description: Received. The panel shows the owner the answer's class and status.
        default:
          description: The panel shows the owner the failure's class and status.
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An integration key, `tt_live_` followed by 43 base64url characters.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Makes a write safe to retry for 24 hours. The same key with a request that differs in any byte of the method, path, query or body is 422.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: "^[!-~]{1,255}$"
      example: order-1042-v3
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 500
    LocationRef:
      name: ref
      in: path
      required: true
      description: The business's reference for the location (percent-decoded once, then matched).
      schema:
        $ref: "#/components/schemas/ExternalRef"
      example: KF-VLT
    EmployeeRef:
      name: ref
      in: path
      required: true
      description: The business's reference for the employee (percent-decoded once, then matched).
      schema:
        $ref: "#/components/schemas/ExternalRef"
      example: E-1042
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: The `ETag` of a copy you hold; when it is the guide's current one the answer is 304.
      schema:
        type: string
    Signature:
      name: X-Taptime-Signature
      in: header
      required: true
      description: "`sha256=` and the lower-case hex HMAC-SHA256 of the body's bytes, keyed by the signing key's text."
      schema:
        type: string
        pattern: "^sha256=[0-9a-f]{64}$"
    WebhookUserAgent:
      name: User-Agent
      in: header
      required: true
      schema:
        type: string
        enum: [Taptime-Webhooks/1]
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
    IdempotentReplayed:
      description: "`true` when the answer is a replay of an earlier request with the same Idempotency-Key (the work was not done again). Absent otherwise."
      schema:
        type: string
        enum: ["true"]
    ETag:
      description: The guide's version (a digest of its bytes).
      schema:
        type: string
        pattern: '^"[0-9a-f]{32}"$'
    CacheControl:
      description: "`no-cache`: a copy may be kept but is revalidated with If-None-Match."
      schema:
        type: string
        enum: [no-cache]
    ContentLanguage:
      description: The guide's language.
      schema:
        type: string
        enum: [en, tr]
  schemas:
    ExternalRef:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9][A-Za-z0-9._~-]{0,63}$"
    LocationPut:
      type: object
      additionalProperties: false
      required: [name, active]
      properties:
        name:
          type: string
          description: |
            1 to 80 characters once surrounding spaces are removed (they are removed). Emoji, flags and
            every script's letters are accepted. A soft hyphen, the direction marks U+200E, U+200F and
            U+061C and a byte-order mark at either end are removed. A NEW or CHANGED name cannot carry
            a control character, a line or paragraph separator (U+2028, U+2029), a direction override
            or isolate (U+202A-U+202E, U+2066-U+2069), a zero-width space (U+200B), a word joiner
            (U+2060) or an inner U+FEFF, nor a joiner (U+200C, U+200D) that is not between two visible
            characters or a tag character (U+E0020-U+E007F) outside a flag (422 validation_failed,
            details.reason hidden_character); a name already on file is accepted as it is.
        active:
          type: boolean
          description: A label. It does not change how taps at the location are judged.
        timezone:
          type: string
          minLength: 1
          description: Optional. When present it must be the business's time zone.
        externalRef:
          type: string
          description: Optional. When present it must be the reference in the path.
    Location:
      type: object
      additionalProperties: false
      required: [id, externalRef, name, timezone, active, createdAt]
      properties:
        id:
          type: string
          pattern: "^loc_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        externalRef:
          $ref: "#/components/schemas/ExternalRef"
        name:
          type: string
        timezone:
          type: string
          description: The business's time zone (a location has none of its own).
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
    EmployeePut:
      type: object
      additionalProperties: false
      required: [firstName, lastName, email, active]
      properties:
        firstName:
          type: string
          description: |
            Surrounding spaces are removed and inner runs of spaces collapsed; firstName and lastName
            together at most 120 characters. A NEW or CHANGED name cannot carry a control character
            (a tab or a line break included), a line or paragraph separator, a direction override or
            isolate, a zero-width space, a word joiner or an inner U+FEFF, nor a joiner or tag
            character outside an emoji, a flag or a word (422, details.reason hidden_character).
        lastName:
          type: string
          description: As firstName.
        email:
          type: ["string", "null"]
          description: |
            One plain ASCII address, at most 254 characters, not an administrator's of the business;
            null for none. The activation e-mail goes here.
        active:
          type: boolean
          description: false deactivates the employee (limited per key per hour).
        employeeCode:
          type: ["string", "null"]
          description: Optional. 1 to 64 characters once surrounding spaces are removed; null for none. A PUT replaces -- left out, it becomes null.
        externalRef:
          type: string
          description: Optional. When present it must be the reference in the path.
    Employee:
      type: object
      additionalProperties: false
      required: [id, externalRef, employeeCode, firstName, lastName, fullName, active, activated, activatedAt, hasEmail, activationEmail, createdAt, updatedAt]
      properties:
        id:
          type: string
          pattern: "^emp_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        externalRef:
          type: ["string", "null"]
          description: null for an employee created in the Taptime panel and not bound yet.
        employeeCode:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
          description: null for an employee created in the Taptime panel (fullName is its name).
        lastName:
          type: ["string", "null"]
        fullName:
          type: string
        active:
          type: boolean
          description: false once deactivated.
        activated:
          type: boolean
          description: The employee has activated a phone.
        activatedAt:
          type: ["string", "null"]
          format: date-time
        hasEmail:
          type: boolean
          description: Whether an e-mail address is on file. The address itself is never answered.
        activationEmail:
          type: object
          additionalProperties: false
          required: [status, at]
          properties:
            status:
              type: string
              enum: [queued, sent, undelivered, none]
              description: "queued: waiting to be sent (also while a failed send is retried); sent: a link was delivered and still works; undelivered: the last attempt did not reach the employee and nothing is queued -- resend-activation asks again; none: none of those."
            at:
              type: ["string", "null"]
              format: date-time
              description: When it was queued, sent, or last failed; null for none.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PunchEmployee:
      type: object
      additionalProperties: false
      required: [id, externalRef, employeeCode, company]
      description: The employee as they were at the punch.
      properties:
        id:
          type: string
          pattern: "^emp_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        externalRef:
          type: ["string", "null"]
          description: null for an employee not bound to a reference yet.
        employeeCode:
          type: ["string", "null"]
        company:
          type: ["string", "null"]
          description: The employee's business's company code.
    PunchLocation:
      type: object
      additionalProperties: false
      required: [id, externalRef, name, company]
      description: |
        The location as it was at the punch. id, externalRef and name are null for a plaque that
        was not mounted at a location (company still names the plaque's business); all four are
        null for a punch at a partner's location approved after the two companies' group
        membership ended.
      properties:
        id:
          type: ["string", "null"]
          pattern: "^loc_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        externalRef:
          type: ["string", "null"]
        name:
          type: ["string", "null"]
        company:
          type: ["string", "null"]
          description: The location's business's company code.
    Punch:
      type: object
      additionalProperties: false
      required: [id, version, status, punchTime, recordedAt, channel, direction, employee, location, tagId]
      properties:
        id:
          type: string
          pattern: "^pch_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: The punch. A punch between two companies of one group has the same id in both feeds.
        version:
          type: integer
          enum: [1]
        status:
          type: string
          enum: [valid]
        punchTime:
          type: string
          format: date-time
          description: The instant the employee's phone declared (UTC).
        recordedAt:
          type: string
          format: date-time
          description: The instant the punch entered the feed (UTC) -- for an approved flag, the approval's.
        channel:
          type: string
          enum: [nfc, qr]
        direction:
          type: string
          enum: [in, out]
          description: In or out, as Taptime computed it for the employee's own business.
        employee:
          $ref: "#/components/schemas/PunchEmployee"
        location:
          $ref: "#/components/schemas/PunchLocation"
        tagId:
          type: ["string", "null"]
          pattern: "^tag_[0-9A-Fa-f]{14}$"
          description: The plaque touched (also for a QR punch).
    PunchDelivery:
      type: object
      additionalProperties: false
      required: [event, deliveryId, id, version, status, punchTime, recordedAt, channel, direction, employee, location, tagId]
      description: A webhook delivery's body -- the Punch with event and deliveryId.
      properties:
        event:
          type: string
          enum: [punch]
        deliveryId:
          type: string
          pattern: "^dlv_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: The delivery -- the same on every try of it.
        id:
          type: string
          pattern: "^pch_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: The punch. A punch between two companies of one group has the same id in both feeds.
        version:
          type: integer
          enum: [1]
        status:
          type: string
          enum: [valid]
        punchTime:
          type: string
          format: date-time
          description: The instant the employee's phone declared (UTC).
        recordedAt:
          type: string
          format: date-time
          description: The instant the punch entered the feed (UTC) -- for an approved flag, the approval's.
        channel:
          type: string
          enum: [nfc, qr]
        direction:
          type: string
          enum: [in, out]
          description: In or out, as Taptime computed it for the employee's own business.
        employee:
          $ref: "#/components/schemas/PunchEmployee"
        location:
          $ref: "#/components/schemas/PunchLocation"
        tagId:
          type: ["string", "null"]
          pattern: "^tag_[0-9A-Fa-f]{14}$"
          description: The plaque touched (also for a QR punch).
    Ping:
      type: object
      additionalProperties: false
      required: [event, id, sentAt]
      properties:
        event:
          type: string
          enum: [ping]
        id:
          type: string
          format: uuid
          description: The test message (not a punch, not a delivery).
        sentAt:
          type: string
          format: date-time
    PunchPage:
      type: object
      additionalProperties: false
      required: [data, nextCursor, hasMore]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Punch"
        nextCursor:
          type: string
          description: Pass as `cursor` for the next page. Always present; never goes back.
        hasMore:
          type: boolean
          description: The feed held more than this page when it was read; read on.
    EmployeePage:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Employee"
        nextCursor:
          type: ["string", "null"]
          description: Set when the page is full (it holds `limit` employees); null on a shorter page, the last.
    DirectoryEntry:
      type: object
      additionalProperties: false
      required: [id, company, externalRef, employeeCode, firstName, lastName, fullName, active, updatedAt]
      properties:
        id:
          type: string
          pattern: "^emp_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        company:
          type: ["string", "null"]
          description: The employee's business's company code -- this business's or a group partner's.
        externalRef:
          type: ["string", "null"]
          description: null for an employee not bound to a reference yet.
        employeeCode:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
          description: null for an employee the panel created and no integration named yet.
        lastName:
          type: ["string", "null"]
        fullName:
          type: string
          description: The name Taptime shows -- always present, also for an employee the panel created without a first and last name.
        active:
          type: boolean
          description: false for a deactivated employee.
        updatedAt:
          type: string
          format: date-time
          description: When a directory field of the employee last changed (UTC).
    DirectoryPage:
      type: object
      additionalProperties: false
      required: [data, nextCursor, hasMore, asOf]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryEntry"
        nextCursor:
          type: ["string", "null"]
          description: Pass as `cursor` (with the same `updatedSince`) for the walk's next page; null at its end.
        hasMore:
          type: boolean
          description: The walk goes on; read the next page.
        asOf:
          type: string
          format: date-time
          description: The walk's clock (UTC), the same on each of its pages. After the last page, the next walk's `updatedSince`.
    Error:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
          enum: [invalid_request, body_too_large, unauthorized, api_disabled, tenant_suspended, not_found, email_unavailable, already_activated, idempotency_key_reused, validation_failed, timezone_mismatch, rate_limited, deactivation_budget_exceeded, unavailable]
        message:
          type: string
          description: A sentence for a person. Never contains the request's own values.
        details:
          $ref: "#/components/schemas/ErrorDetails"
    ErrorDetails:
      type: object
      additionalProperties: false
      description: Machine-readable specifics; may be empty. Every key is optional; none repeats a value the request sent.
      properties:
        field:
          type: string
          description: The body field (or `ref`, the path's reference) at fault -- validation_failed, timezone_mismatch.
          enum: [name, active, timezone, externalRef, ref, firstName, lastName, email, employeeCode]
        reason:
          type: string
          description: "Why: required, type, invalid, mismatch, unknown_field, duplicate_field, hidden_character, administrator_address (validation_failed); malformed_json, invalid_utf8, unencoded_plus (invalid_request)."
          enum: [required, type, invalid, mismatch, unknown_field, duplicate_field, hidden_character, administrator_address, malformed_json, invalid_utf8, unencoded_plus]
        parameter:
          type: string
          description: The query parameter at fault.
          enum: [limit, cursor, scope, updatedSince]
        parameters:
          type: array
          items:
            type: string
            enum: [from, to]
          description: The query parameters at fault together (from and to).
        allowed:
          type: array
          items:
            type: string
          description: The names this endpoint accepts (fields, parameters or values); empty for a GET that takes no query parameter.
        header:
          type: string
          description: The request header at fault.
          enum: [Content-Encoding, Idempotency-Key]
        max:
          type: integer
          description: The largest value accepted (limit).
        maxBytes:
          type: integer
          description: The largest body accepted.
        maxHours:
          type: integer
          description: The longest history range accepted, in hours.
        retryAfterSeconds:
          type: integer
          description: The same as Retry-After.
        businessTimezone:
          type: string
          description: The business's own time zone -- the one value here that is not a constant, and not the request's.
  responses:
    BadRequest:
      description: "invalid_request or body_too_large: a parameter, header or body the contract refuses."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            limit:
              value: {"code": "invalid_request", "message": "limit must be a whole number from 1 to 1000.",
                "details": {"max": 1000, "parameter": "limit"}}
            body_too_large:
              value: {"code": "body_too_large", "message": "The request body is larger than the API accepts.",
                "details": {"maxBytes": 65536}}
    Unauthorized:
      description: "unauthorized: no key, or a key that is not valid (unknown and revoked keys get the same answer)."
      headers:
        WWW-Authenticate:
          description: '`Bearer realm="taptime"`.'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unauthorized:
              value: {"code": "unauthorized", "message": "A valid integration key is required: Authorization: Bearer <key>.",
                "details": {}}
    Forbidden:
      description: "api_disabled: the API is not enabled for this business; tenant_suspended: the business is suspended and this change is not accepted."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            api_disabled:
              value: {"code": "api_disabled", "message": "The integration API is not enabled for this business. Ask Taptime to enable it.",
                "details": {}}
            tenant_suspended:
              value: {"code": "tenant_suspended", "message": "This business is suspended; this change is not accepted until it is reinstated.",
                "details": {}}
    NotFound:
      description: "not_found: no such resource (on an Idempotency-Key replay: the location or employee it recorded no longer exists)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            not_found:
              value: {"code": "not_found", "message": "This business has no employee with that reference.", "details": {}}
    Conflict:
      description: "email_unavailable: another active employee of the business has the address; already_activated: the employee has activated already."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            email_unavailable:
              value: {"code": "email_unavailable", "message": "Another active employee of this business already has that address.",
                "details": {}}
            already_activated:
              value: {"code": "already_activated", "message": "This employee has already activated. A new device is set up in the Taptime panel.",
                "details": {}}
    Unprocessable:
      description: "idempotency_key_reused: the Idempotency-Key was used with a different request; validation_failed: a field or the path's reference the contract refuses (details.field and details.reason); timezone_mismatch: a location's time zone must be its business's (details.businessTimezone)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unknown_field:
              value: {"code": "validation_failed", "message": "The body carries a field this endpoint does not accept.",
                "details": {"allowed": ["name", "active", "timezone", "externalRef"], "reason": "unknown_field"}}
            timezone_mismatch:
              value: {"code": "timezone_mismatch", "message": "A location's time zone is its business's; send the business's zone or none.",
                "details": {"businessTimezone": "Europe/Malta", "field": "timezone"}}
            idempotency_key_reused:
              value: {"code": "idempotency_key_reused", "message": "This Idempotency-Key was used in the last 24 hours with a different request.",
                "details": {}}
    TooManyRequests:
      description: "rate_limited: wait for Retry-After seconds; deactivation_budget_exceeded: this key deactivated as many employees as it may in an hour -- wait for Retry-After seconds."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            rate_limited:
              value: {"code": "rate_limited", "message": "Too many requests. Retry after the time in Retry-After.",
                "details": {"retryAfterSeconds": 60}}
            deactivation_budget_exceeded:
              value: {"code": "deactivation_budget_exceeded", "message": "This key has deactivated as many employees as it may in an hour. Retry after the time in Retry-After.",
                "details": {"retryAfterSeconds": 1500}}
    Unavailable:
      description: "unavailable: the request could not be completed on our side (the cause is in Taptime's log only); retry."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unavailable:
              value: {"code": "unavailable", "message": "The request could not be completed on our side. Try again shortly.",
                "details": {}}
    Guide:
      description: The guide, Markdown (UTF-8).
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Content-Language:
          $ref: "#/components/headers/ContentLanguage"
      content:
        text/markdown:
          schema:
            type: string
    GuideNotModified:
      description: The copy named by If-None-Match is the current guide; no body.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
