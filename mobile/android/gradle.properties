# Memory is tight on the build machine (same caps as android/gradle.properties): a capped
# daemon, a single-threaded build. Do not run the Go test suite while this builds.
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=false
org.gradle.configuration-cache=false

# Compose and activity-compose are AndroidX artefacts (Q36), so AndroidX is on.
android.useAndroidX=true
android.nonTransitiveRClass=true
