# Tappa — build, push and deploy (M8-02).
#
# 🔴 THIS RUNS ONLY AFTER `ci` HAS GONE GREEN ON main, AND workflow_run WAS CHOSEN
# OVER A JOB INSIDE ci.yml FOR A SECURITY REASON, NOT A STYLISTIC ONE.
#
# The two candidates were measured against each other:
#
#   (a) `deploy` as a job in ci.yml with `needs: check`. Strongest possible
#       ordering — same run, same SHA, cannot start unless check succeeded. But
#       ci.yml is `on: push` for EVERY branch and `on: pull_request`. The workflow
#       file holding a kubeconfig and packages:write would then be the same file
#       that any branch push evaluates, guarded only by an `if:` on the ref. An `if:`
#       is one edit away from not being there.
#
#   (b) `on: workflow_run`. GitHub always runs the DEFAULT BRANCH's copy of a
#       workflow_run workflow, regardless of which commit triggered it. A pull
#       request therefore cannot modify this file and have its modification run —
#       the credentials below are unreachable from any branch but main. And ci.yml
#       is not touched at all, so the gate everything else depends on carries none
#       of this risk. CHOSEN.
#
# ⚠️ THE COST OF (b), STATED: workflow_run's default checkout is the default
# branch's HEAD, NOT the commit that was tested. That is the classic footgun and
# every step below pins github.event.workflow_run.head_sha explicitly.
name: deploy

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  # Manual re-deploy of whatever is on main, for a rollback or a cluster-side fix.
  workflow_dispatch:

# Never cancel a deploy: cancel-in-progress would be able to kill the workflow
# between `goose up` finishing and the new image rolling out, leaving a schema ahead
# of the binary that serves it.
concurrency:
  group: deploy-main
  cancel-in-progress: false

# 🔴 `packages: write` IS GONE, AND ITS ABSENCE IS PART OF THIS ROUND'S WORK.
# This workflow pushes to Docker Hub (see the env block below), so it does not write
# to GitHub's package registry and does not need a token that can. That is a property
# of THIS FILE and stays true whatever a given cluster is currently running.
# GITHUB_TOKEN's remaining scope is `contents: read`, which is what `actions/checkout`
# uses and nothing else.
permissions:
  contents: read

jobs:
  deploy:
    # workflow_run fires on failure too; only a green ci may deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 🔴 DOCKER HUB, PUBLIC — AND THIS IS A FIX FOR A ROOT CAUSE, NOT A PREFERENCE.
      #
      # Backlog T43 said pods land in a permanent ImagePullBackOff. Its measured root
      # cause is this node's kubelet running
      #   imagePullCredentialsVerificationPolicy: NeverVerifyPreloadedImages
      # (KEP-2535, default since 1.35): an image the kubelet pulled WITH a credential
      # is usable only by a pod presenting a credential already recorded against that
      # image. Three probes on this node against the tag the live pod was running: no
      # secret -> 401 · a secret it had never used -> 401 · imagePullPolicy Never ->
      # "not present". The control that separates cache from credential: a PUBLIC image
      # with imagePullPolicy Never started straight from the node's cache, exit 0.
      #
      # A PUBLIC REPOSITORY THEREFORE DELETES THE DEFECT BY DEFINITION — there is no
      # credential to record, to go stale, or to be overwritten by the next deploy.
      #
      # WHAT THIS FILE REMOVES — all four are properties of the file and stay true
      # whatever the cluster is running: the "Write the GHCR pull credential" step (one
      # fewer path that creates a Secret, CLAUDE.md §4.7) · `imagePullSecrets` in both
      # pod specs · the Secret that step wrote · the "Recover pods stuck on a stale
      # pull credential" step, whose premise was that very credential.
      #
      # ⚠️ WHAT IT DOES NOT REMOVE IS THE STALE-CREDENTIAL WINDOW IN A CLUSTER THAT HAS
      # NOT YET RUN THIS WORKFLOW, and this sentence is conditional on purpose: WHILE
      # the running pods were pulled with a credential, `kubectl rollout undo` still
      # meets a revoked token; ONCE they were pulled anonymously, it cannot. Which one
      # holds is a fact about the cluster, recorded — with the command that measures
      # it — in exactly one place: deploy/README.md, "Elle deploy / rollback". An
      # earlier revision of this comment asserted the second half as though it were
      # already true everywhere; that is the defect this repository keeps paying for.
      #
      # ELIMINATED, WITH REASONS. GHCR-public: unreachable, not undesirable — package
      # visibility has NO API (measured three times: `gh api -X PATCH
      # /user/packages/container/tappa -f visibility=public` -> 404, no such endpoint;
      # `gh api /user/packages/container/tappa` -> 403), it is a web-UI-only action and
      # the user attempted it twice without success. AWS ECR private: reintroduces the
      # same credential problem with a rotating IAM token, which is worse. ECR Public:
      # accepts pushes only from us-east-1 and requires an AWS account.
      #
      # ⚠️ THE COST, COUNTED: anonymous Docker Hub pulls are rate limited, measured from
      # this network for postgres:17-alpine as `x-ratelimit-limit: 100;w=3600`. The
      # product images now spend from that same per-IP budget. It is wide for one node
      # that pulls twice per deploy, and it is written into deploy/README.md's
      # accepted-limits list rather than left to be discovered.
      APP_IMAGE: docker.io/atknatk/tappa
      MIGRATE_IMAGE: docker.io/atknatk/tappa-migrate
      # The cluster is k3s v1.35.4 (measured). kubectl's supported skew is one minor
      # either way; pinning to the server's own minor removes the question.
      KUBECTL_VERSION: v1.35.4
      KUBECTL_SHA256: b529430df69a688fd61b64ad2299edb5fd71cb58be2a4779dba624c7d3510efd

    steps:
      # 🔴 FIRST STEP ON PURPOSE, AND THE MESSAGE IS THE WHOLE POINT.
      # An UNDEFINED GitHub secret renders as an EMPTY STRING, it is not an error, so
      # without this step the run continues to `docker login` and fails there. Measured
      # what that failure actually looks like, with the real client:
      #   printf '' | docker login docker.io -u ""        --password-stdin -> rc 1, "username is empty"
      #   printf '' | docker login docker.io -u "someuser" --password-stdin -> rc 1, "password is empty"
      #   printf 'x' | docker login docker.io -u "someuser" --password-stdin -> rc 1,
      #       'unauthorized: incorrect username or password'
      # None of those three names a GitHub secret, says which one is missing, or says
      # where to make it. That is the gap this step closes; it does not "protect"
      # anything, it explains.
      #
      # ⚠️ DEGENERATE INPUTS WERE ENUMERATED AND RUN, because this file's review record
      # is five REDs caused by shell that was only ever tried on the input somebody
      # imagined: both unset · both empty · only the username · only the token · a
      # single space · a tab and a newline · a trailing newline · both set. `${VAR:-}`
      # keeps `set -u` from firing on an unset variable.
      #
      # 🔴 THE TEST IS POSITIVE ("does it contain a usable character") AND NOT NEGATIVE
      # ("is it only whitespace"), AND THAT CHANGE IS A MEASURED FIX RATHER THAN A
      # STYLE PREFERENCE. The first version trimmed with `tr -d '[:space:]'` and then
      # tested for emptiness. `tr` is BYTE oriented in GNU coreutils, which is what
      # ubuntu-latest ships: a value consisting only of U+00A0 (c2 a0) or U+3000
      # (e3 80 80) survives the trim there and the step PASSES. It does not survive on
      # the BSD `tr` of the machine this was written on, so the author's own local
      # measurement said the opposite of what the runner does — the same
      # local-tool-substituted-for-runner-tool error this task was already caught by
      # once, in the same file. The consequence was mild (docker login fails one step
      # later, fail-closed) but it defeated the ONE thing this step exists for: naming
      # the missing secret.
      #
      # A `case` glob has no such split: it is bash's own matcher, no external tool, and
      # `*[0-9A-Za-z]*` was measured to REJECT U+00A0 and U+3000 and ACCEPT "alice"
      # under LC_ALL of C, C.UTF-8, en_US.UTF-8, tr_TR.UTF-8 and POSIX — five for five,
      # including the Turkish locale whose dotless-i collation is the usual trap
      # ("ıstanbul9" is accepted; a digits-only "12345" is accepted). No valid input is
      # excluded: a Docker Hub username is [a-z0-9] and a PAT is dckr_pat_<base64url>,
      # so both always contain an ASCII alphanumeric.
      - name: Preflight — the Docker Hub credentials must exist
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          # Report the SHAPE, never the value: a length, never a character.
          u=${DOCKERHUB_USERNAME:-}
          t=${DOCKERHUB_TOKEN:-}
          case $u in *[0-9A-Za-z]*) ;; *) missing="$missing DOCKERHUB_USERNAME" ;; esac
          case $t in *[0-9A-Za-z]*) ;; *) missing="$missing DOCKERHUB_TOKEN" ;; esac
          if [ -n "$missing" ]; then
            echo "::error::missing GitHub repository secret(s):$missing. This deploy pushes to Docker Hub. Create a token at Docker Hub -> Account Settings -> Personal access tokens with Read & Write, then: gh secret set DOCKERHUB_USERNAME --repo atknatk/tappa ; gh secret set DOCKERHUB_TOKEN --repo atknatk/tappa. Nothing has been built and nothing in the cluster has been touched."
            exit 1
          fi
          echo "docker hub credentials present (username ${#u} chars, token ${#t} chars)"

      - name: Resolve the commit to deploy
        id: sha
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sha="${{ github.sha }}"
          else
            sha="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "full=$sha"           >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:12}"   >> "$GITHUB_OUTPUT"
          echo "deploying $sha"

      # ⚠️ PINNED BY TAG, NOT BY COMMIT SHA — a decision, stated rather than left to
      # be noticed. A moving major tag means the action's code can change under this
      # workflow, and this workflow holds a kubeconfig. It is kept because ci.yml
      # already states the repository's rule (Q25(b)): first-party actions only,
      # pinned by major tag. Two consequences follow, and the second is why the
      # inconsistency with KUBECTL_SHA256 below is not an oversight: `checkout` is
      # published by GitHub itself and runs on GitHub's own runner, whereas kubectl
      # is a third-party download over the network, where a sha256 is the only thing
      # standing between a swapped binary and the cluster. Different threat, different
      # treatment. Changing this to a sha is a repo-wide decision (ci.yml pins the
      # same way), not one this file should make on its own.
      - name: Checkout that exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.full }}
          # 🔴 .git MUST SURVIVE INTO THE DOCKER CONTEXT. Go's -buildvcs stamps
          # vcs.revision/vcs.modified from it inside the builder, internal/buildinfo
          # reads them back, and cmd/tappa logs one line naming the running commit
          # before it dials the database. A build with no .git loses that silently —
          # no error, no warning, and a deployment that cannot say what it is running.
          # actions/checkout leaves a CLEAN tree, so vcs.modified comes out false;
          # verified in this task with a clean-clone control build.
          fetch-depth: 1
          # 🔴 persist-credentials: false IS NOT COSMETIC HERE. With the default,
          # actions/checkout writes the job's token into .git/config as an
          # http.extraheader — and .git is deliberately part of the docker build
          # context (above), so that token would be copied into a build-stage layer.
          # The final image is `scratch` and carries only two files, so it would not
          # be published; but a credential that reaches a layer at all is a
          # credential in a place nobody is auditing (CLAUDE.md §4.7).
          persist-credentials: false

      # Only first-party actions are used in this repository (ci.yml states the rule
      # and the reason: Q25(b)). Everything below is the plain CLI that ubuntu-latest
      # already ships, so no docker/login-action, no docker/build-push-action and no
      # third-party kubectl installer appears here.
      # 🔴 B8: scripts/verify-image.sh RUNS `go version -m`, AND UNTIL THIS STEP THAT
      # WAS AN UNDECLARED DEPENDENCY ON WHATEVER GO THE RUNNER IMAGE HAPPENED TO SHIP.
      # The failure mode was fail-closed (no go → the gate errors → no push), so it was
      # never going to ship a bad artifact; but "works because the runner image happens
      # to include it" is exactly the kind of unstated assumption this repository keeps
      # paying for. Pinned to the version the Dockerfile builds with, and setup-go is
      # first-party like every other action here (ci.yml, Q25(b)).
      - name: Set up Go (verify-image.sh reads buildinfo with it)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: false

      # The token is piped, never passed as an argument: an argument reaches `ps` and
      # the process table of a shared runner.
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build both images
        env:
          SHORT: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          # The two targets share the `build` stage, so the second build is a cache
          # hit on everything expensive (measured locally: 3 min 58 s for the app,
          # then 8 s for the migrator).
          #
          # 🔴 ONE TAG PER IMAGE, AND `:main` IS GONE. It used to be built and pushed
          # "for humans" and was referenced by nothing — no manifest, no rollback path,
          # no runbook command. On a PRIVATE registry that was merely useless; on a
          # PUBLIC one it is a moving tag anybody can pull and mistake for the current
          # release, which is this repository's named defect class (a moving tag next to
          # imagePullPolicy: IfNotPresent is how a node silently serves last week's
          # binary). Rollback uses the immutable `sha-<12hex>` tag, which is the only
          # thing 20-app.yaml and 30-migrate-job.yaml have ever named.
          docker build --target app     -t "$APP_IMAGE:sha-$SHORT" .
          docker build --target migrate -t "$MIGRATE_IMAGE:sha-$SHORT" .

      - name: Prove the artifact identifies itself before it is pushed
        env:
          SHORT: ${{ steps.sha.outputs.short }}
          FULL: ${{ steps.sha.outputs.full }}
        # 🔴 THE GATE LIVES IN scripts/verify-image.sh, NOT HERE, AND THAT MOVE IS
        # ITSELF A FINDING'S FIX. The first version of this step was inline shell and
        # parsed `go version -m` with awk on the wrong field; it produced two empty
        # variables, compared them against the deploy sha, and therefore FAILED EVERY
        # RUN — before `Push`, so nothing could be deployed at all. A security audit
        # measured it. The deeper problem is that a gate which only exists inside a
        # workflow cannot be pointed at a known-good and a known-bad image by the
        # person writing it; the script can, and this task's report shows all three
        # runs (clean+correct → pass, clean+wrong-sha → fire, dirty → fire).
        run: scripts/verify-image.sh "$APP_IMAGE:sha-$SHORT" "$FULL"

      - name: Prove the MIGRATION image carries this commit's migrations
        env:
          SHORT: ${{ steps.sha.outputs.short }}
        # 🔴 THE OTHER ARTIFACT, WHICH SHIPPED UNGATED UNTIL NOW (audit B7) — and it is
        # the more dangerous of the two: the server cannot touch the schema, this image
        # runs DDL as tappa_owner, the bootstrap SUPERUSER that bypasses RLS. It cannot
        # be checked by buildinfo (goose is built from its own module and stamps goose's
        # revision), so the gate checks the PAYLOAD: the migrations inside it must be
        # byte-identical to db/migrations at this commit.
        run: scripts/verify-image.sh --migrate "$MIGRATE_IMAGE:sha-$SHORT"

      - name: Push
        env:
          SHORT: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          # ⚠️ A FIRST PUSH TO A REPOSITORY THAT DOES NOT EXIST YET CREATES IT AS
          # PRIVATE, and Docker Hub exposes no way to set visibility at push time. The
          # NEXT step is the mechanism that refuses to continue in that state; this
          # comment used to point at an instruction in the README instead, which is
          # this card's signature defect (announcing a guarantee with no mechanism).
          docker push "$APP_IMAGE:sha-$SHORT"
          docker push "$MIGRATE_IMAGE:sha-$SHORT"

      # 🔴 THE WHOLE POINT OF MOVING REGISTRIES IS THAT THE IMAGES ARE PULLABLE WITH NO
      # CREDENTIAL, AND UNTIL THIS STEP THAT WAS AN INSTRUCTION IN A README RATHER THAN
      # A MECHANISM. A snapshot, dated because it goes stale on the first successful
      # push: on 2026-08-16 hub.docker.com/v2/repositories/atknatk/tappa/ -> 404 and
      # .../tappa-migrate/ -> 404, i.e. neither repository existed yet. The step below
      # does not depend on that reading. The durable statement is the mechanism: WHILE
      # a repository is absent or private, a push creates or leaves it private and the
      # KEP-2535 defect this change exists to remove comes straight back; ONCE it is
      # public the gate below passes. The gate is what refuses, not this comment.
      #
      # WHY IT RUNS HERE. After the push (there is nothing to inspect before it) and
      # before kubectl is even installed, so a failure changes NOTHING in the cluster.
      #
      # 🔴 HOW IT IS MADE ANONYMOUS, AND WHY NOT `docker logout`. `docker logout` edits
      # config.json on a runner but goes through a credential HELPER on a developer
      # machine (measured on the machine this was written on: `credsStore: desktop`),
      # so a gate built on it would be verified against a different mechanism than the
      # one it runs on — the same local-vs-runner substitution this task was already
      # caught by once. Pointing DOCKER_CONFIG at an EMPTY directory has no such
      # split: the docker CLI reads auths, credsStore and credHelpers only from
      # $DOCKER_CONFIG/config.json, and an empty directory has none of the three.
      #
      # THE CONTROL THAT PROVES IT IS ANONYMOUS, rather than merely believed to be:
      #   empty DOCKER_CONFIG   + docker.io/library/postgres:17-alpine  -> rc 0
      #   DOCKER_CONFIG holding a BOGUS docker.io auth + the same image -> rc 1,
      #       'unauthorized: incorrect username or password'
      # The second row is the discriminating one: if DOCKER_CONFIG were ignored, a
      # deliberately wrong credential could not have changed the outcome. It also
      # proves the machine's real credential store was bypassed. And the directory is
      # still EMPTY afterwards (`ls -a` -> only . and ..), so no token is cached.
      #
      # ⚠️ WHICH DIRECTION IT FAILS, ENUMERATED RATHER THAN ASSUMED. It exits 0 ONLY
      # when the registry hands over the manifest with no credential. Every other
      # outcome is red, and each was measured with the real client:
      #   repository private or absent -> rc 1, 'denied: requested access to the
      #                                   resource is denied / unauthorized'
      #   tag missing                  -> rc 1, 'no such manifest: ...'
      #   registry unreachable / DNS   -> rc 1, 'error pinging v2 registry ... no such host'
      #   rate limited (429)           -> rc 1, toomanyrequests (same branch as above)
      #   docker binary absent         -> rc 127, caught by the same `|| rc=$?`
      #                                   (measured with a PATH holding coreutils but
      #                                   no docker: rc 1, two named errors)
      #
      # 🔴 AND THE EXIT CODE ALONE IS NOT THE TEST, BECAUSE THE FIRST DRAFT OF THIS
      # STEP HAD A FAIL-OPEN CELL AND ITS OWN MATRIX FOUND IT. A stub that exits 0 and
      # prints NOTHING was waved through as "anonymous pull OK" — the repository's
      # named trap in its purest form: a healthy answer and an empty answer are not the
      # same thing, and only one of them was being looked at. The evidence this gate
      # exists to obtain IS the manifest, so the manifest is what is checked: the
      # output must carry `"schemaVersion"`. Measured on three public references
      # (postgres:17-alpine, alpine:3, hello-world:latest): rc 0, 5000-6339 bytes of
      # JSON, `"schemaVersion"` present in all three. If a future client ever stopped
      # emitting it, this gate would fail CLOSED, which is the correct direction.
      #
      # Its stderr is PRINTED rather than discarded, and that is safe here for a reason
      # specific to this command rather than to the cluster: it runs against an EMPTY
      # DOCKER_CONFIG created two lines above, so that invocation has no credential
      # store to read from and nothing to echo out of one.
      - name: Gate — both images must be pullable with NO credential
        env:
          SHORT: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          anon=$(mktemp -d)
          trap 'rm -rf "$anon"' EXIT
          bad=0
          for ref in "$APP_IMAGE:sha-$SHORT" "$MIGRATE_IMAGE:sha-$SHORT"; do
            rc=0
            out=$(DOCKER_CONFIG="$anon" docker manifest inspect "$ref" 2>&1) || rc=$?
            # A manifest, not merely a zero. See the block above for the fail-open cell
            # this closes and the three references the marker was measured on.
            case $out in *'"schemaVersion"'*) ;; *) rc=${rc:-0}; [ "$rc" -eq 0 ] && rc=90 ;; esac
            if [ "$rc" -eq 0 ]; then
              echo "anonymous pull OK: $ref"
            else
              bad=1
              # 🔴 THE README'S LIMIT KEY IS NOT QUOTED HERE, AND THAT IS DELIBERATE.
              # The key is spelled in Turkish with diacritics; CLAUDE.md §7 keeps error
              # messages ASCII English, so writing it here would either violate that or
              # produce a MIS-SPELLED key an operator could grep for and never find.
              # The section is named instead. (An earlier draft of this line did quote
              # an ASCII-folded copy of the key, which is precisely that broken
              # reference; it was caught by byte-comparing it against the README.)
              echo "::error::$ref is NOT pullable without a credential (docker manifest inspect exit $rc). If this says 'denied'/'unauthorized', the Docker Hub repository is PRIVATE — a first push creates it that way. Set it to Public (Docker Hub -> Repository -> Settings -> Visibility) and re-run; deploy/README.md, operator step 4, item 3. Leaving it private brings back the kubelet credential-verification defect this registry move exists to remove. Nothing has been applied to the cluster."
              printf '%s\n' "$out" | tail -3
            fi
          done
          [ "$bad" -eq 0 ]

      - name: Install kubectl (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum -c -
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Write kubeconfig
        # 🔴 THE VALUE ARRIVES THROUGH env:, NOT THROUGH `${{ }}` INSIDE THE SCRIPT,
        # AND THAT WAS THE LAST INLINE EXPANSION IN THIS FILE. An expression inside a
        # `run:` body is substituted BEFORE the shell starts, so the rendered step
        # script written to the runner's disk contains the secret in clear text.
        # This is the most valuable credential in the workflow — accepted limit
        # "[kubeconfig'in kimliği doğrulanmadı]" says it may still be a cluster-admin
        # kubeconfig — and it was the only one still spelled the old way, while the two
        # Docker Hub steps above already do it correctly and say why. Measured after
        # the change: `grep -n 'secrets\.' .github/workflows/deploy.yml` -> five hits,
        # ALL FIVE inside `env:` blocks, ZERO inside a `run:` body.
        # It did not leak today — measured by parsing every `run:` body and stripping
        # comments: 17 run bodies, ZERO non-comment occurrences of `set -x` — so this
        # is a shape fix, not an incident. But one shape for one rule.
        #
        # ⚠️ WHERE A BROKEN SECRET IS CAUGHT — MEASURED ON THE RUNNER'S PLATFORM,
        # BECAUSE THE FIRST VERSION OF THIS COMMENT WAS MEASURED ON A MAC AND SAID THE
        # OPPOSITE. It claimed `base64 -d` is "lenient" and that the last line is the
        # real gate. That is BSD base64. GNU coreutils, which is what ubuntu-latest
        # ships, rejects malformed input. Both matrices, same script, same inputs:
        #
        #   input        ubuntu:24.04 (GNU coreutils 9.4)   this repo author's mac (BSD)
        #   empty        rc 0, 0 bytes                      rc 0, 0 bytes
        #   non-base64   rc 1, "base64: invalid input"      rc 0, 6 bytes
        #   spaces only  rc 1, "base64: invalid input"      rc 0, 0 bytes
        #   leading "-"  rc 1, "base64: invalid input"      rc 0, 3 bytes
        #   valid        rc 0, 15 bytes                     rc 0, 15 bytes
        #
        # So on the runner THIS LINE is the gate for three of the four bad inputs
        # (`set -euo pipefail` turns rc 1 into a red step), and the ONLY case that
        # reaches the bottom of this script is an EMPTY secret — for which
        # `kubectl config current-context` exits 1 with "current-context is not set".
        # ⚠️ GNU base64 writes PARTIAL output before it errors (2 bytes on the
        # non-base64 input above), so the config file can be left half-written on a red
        # step. Direction is unchanged — the step fails and nothing reaches the cluster
        # — but do not read "rc 1" as "wrote nothing".
        # 🔴 THE PRACTICAL CONSEQUENCE, WHICH IS WHY THE WRONG VERSION MATTERED: it
        # handed a maintainer a false causal model in which the last line could be
        # deleted as redundant. It cannot — it is the sole guard for the empty case.
        # (§4.7: GNU base64 prints only "base64: invalid input" and never the value —
        # probed with a marker: 0 occurrences.)
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          # 🔴 THE SECRET IS NAMED KUBE_CONFIG AND IT IS BASE64. A raw YAML value
          # survives GitHub's secret store fine, but `printf` of a multi-line secret
          # is where trailing-newline and CRLF problems live; base64 has neither.
          # Create it with:
          #   base64 -w0 ~/.kube/config | gh secret set KUBE_CONFIG --repo atknatk/tappa
          # ⚠️ Scope it. A full cluster-admin kubeconfig in a CI secret is a
          # cluster-admin credential for anyone who can push to main. The identity this
          # deploy actually needs is now a FILE — deploy/k8s/01-rbac.yaml — applied once
          # by the operator (deploy/README.md step 3). Until KUBE_CONFIG holds THAT
          # ServiceAccount's token, the narrowing in 01-rbac.yaml constrains nothing,
          # because a cluster-admin kubeconfig ignores it.
          mkdir -p "$HOME/.kube"
          # printf, not echo: echo's handling of a value beginning with `-` or holding
          # a backslash is shell-dependent, and base64 -d is unforgiving about both.
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context

      # 🔴 B6: THIS RUNS BEFORE ANYTHING IS APPLIED, AND THE MOVE IS THE POINT.
      # It used to run AFTER the rollout, with no rollback — so a proxied hostname
      # would take LIVE TAP TRAFFIC before the gate fired, and every one of those taps
      # would be judged against a Cloudflare edge address and written into an
      # IMMUTABLE transactions row claiming "network proof of place" it does not have
      # (§4.3 forbids correcting it; backlog T40 is the same defect from the other
      # side). A gate that only reports after the harm is a report, not a gate.
      #
      # It can run this early because it depends on DNS and the shared ingress
      # controller, both of which exist before this deploy touches anything. On a
      # genuinely first deploy the hostname does not resolve yet and the check says so
      # and passes; every other curl failure is now an error rather than a shrug (B5).
      - name: Preflight — the hostname must NOT be proxied by Cloudflare
        # taptime.mt is the primary as of the 2026-09-02 cutover; this gate names the
        # host that actually takes taps, not the legacy redirect target.
        run: scripts/verify-deployment.sh cloudflare taptime.mt

      # 🔴 THE APPLICATION SECRET STAYS THE OPERATOR'S — THIS GATE DOES NOT MOVE.
      # tappa-secrets holds TAPPA_TAG_KEK, the session HMAC key and both DSNs. CI
      # creating those would mean a value that wraps every wall plaque's AES key
      # (§4.7) passes through a workflow log's blast radius and through whoever can
      # push to main. It is created out of band, once, and this step only proves it
      # is there before anything tries to mount it.
      #
      # ⚠️ THERE IS NO LONGER A SECOND, CI-OWNED SECRET TO CHECK. A registry pull
      # credential used to be written a few lines below this one, and the line the two
      # fell on either side of was WHOSE IDENTITY THE CREDENTIAL IS. This workflow no
      # longer writes a pull credential at all, so tappa-secrets is the only Secret it
      # has an opinion about — and its opinion is that it must already exist and must
      # never be written from here. (Whether a pull credential still exists in a given
      # cluster is a different question, and not one this file answers; the single
      # record is deploy/README.md, "Elle deploy / rollback".)
      #
      # ⚠️ THIS STEP IS ALSO THE FIRST CALL THE DEPLOY IDENTITY MAKES AGAINST THE
      # CLUSTER, so it is where a missing or narrowed RBAC surfaces. That is why the
      # apply carries a message: without one, an operator who has not yet applied
      # deploy/k8s/01-rbac.yaml reads a bare 'namespaces "tappa" is forbidden' and has
      # nothing to connect it to. No `kubectl auth can-i` preflight is used, and that is
      # a measured refusal rather than an omission: `kubectl auth can-i create
      # pods/exec` answers about `pods` and returns "yes" for this identity — so does
      # `pods/nonsense` — which makes it a gate capable of passing on a permission the
      # deploy does not have. 01-rbac.yaml carries the full measurement.
      - name: Preflight — the application Secret is the operator's and must already exist
        run: |
          set -euo pipefail
          kubectl apply -f deploy/k8s/00-namespace.yaml || {
            echo "::error::could not apply the namespace. If the message above says 'forbidden', the deploy ServiceAccount is missing or out of date: apply deploy/k8s/01-rbac.yaml with a cluster-admin kubeconfig (deploy/README.md, 'Operatörün yapması gerekenler' step 3). Nothing in the cluster has been changed."
            exit 1
          }
          if ! kubectl -n tappa get secret tappa-secrets >/dev/null 2>&1; then
            echo "::error::secret/tappa-secrets is missing (or unreadable by the deploy identity). It is created out of band and never by CI — see deploy/examples/externalsecret.example.yaml (recommended) or deploy/examples/secret.example.yaml."
            exit 1
          fi

      - name: Apply configuration and database
        run: |
          set -euo pipefail
          kubectl apply -f deploy/k8s/05-config.yaml
          # 🔴 THE INIT ConfigMap IS BUILT FROM THE REPOSITORY'S OWN FILE, so there
          # is exactly ONE definition of the role split anywhere. A hand-written
          # production copy of 01-roles.sql would be a second spelling of the rules
          # that make RLS mean anything (NOBYPASSRLS, NOSUPERUSER, which tables
          # tappa_resolver may see) — and drift between them is invisible until a
          # tenant reads another tenant's rows.
          kubectl -n tappa create configmap tappa-db-init \
            --from-file=01-roles.sql=scripts/db-init/01-roles.sql \
            --from-file=02-app-password.sh=deploy/k8s/postgres-init/02-app-password.sh \
            --dry-run=client -o yaml | kubectl apply -f -
          # 🔴 THE BACKUP SCRIPTS TRAVEL WITH THE COMMIT; THE SCHEDULE DOES NOT.
          # deploy/k8s/50-backup.yaml (the CronJob) is the OPERATOR's — this identity
          # has no verbs on batch/cronjobs and deliberately gets none, because a
          # schedule that never changes per commit does not belong on the per-commit
          # path and widening the Role would make every deploy red until a cluster-admin
          # re-applied 01-rbac.yaml. But the SCRIPTS the CronJob runs do change, and
          # they live in exactly one place (scripts/pg-backup*.sh, inside the tree
          # scripts/redline-check.sh already scans). Rebuilding the ConfigMap here is
          # the same argument as tappa-db-init above: no second copy to drift.
          # ⚠️ Harmless before the operator has applied 50-backup.yaml — this creates a
          # ConfigMap nothing mounts yet — and it is what keeps a CronJob applied ONCE
          # from running last month's script forever.
          kubectl -n tappa create configmap tappa-backup-scripts \
            --from-file=pg-backup.sh=scripts/pg-backup.sh \
            --from-file=pg-backup-ship.sh=scripts/pg-backup-ship.sh \
            --from-file=pg-restore-verify.sh=scripts/pg-restore-verify.sh \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f deploy/k8s/10-postgres.yaml
          kubectl apply -f deploy/k8s/12-networkpolicy.yaml
          # WHAT THIS GATE MEASURES: the StatefulSet has a ready replica, i.e. the
          # kubelet's exec probe (`pg_isready` over the UNIX SOCKET, no -h) answered.
          #
          # 🔴 WHAT IT DOES NOT MEASURE, MEASURED 2026-08-16 ON A FRESH VOLUME:
          # that anything can REACH the database over the network. On that run
          # Postgres opened 0.0.0.0:5432 at 08:50:35.2, the kubelet marked the pod
          # ready at 08:50:38, this command returned at 08:50:39 — and the headless
          # Service's DNS record did not exist until 08:50:42. A Job created the
          # instant this returns can fail to RESOLVE tappa-postgres for about three
          # seconds. There are two more windows it cannot see: the entrypoint's
          # init-script phase runs a temporary server with listen_addresses='' so the
          # exec probe can go green while TCP is shut (0.22 s here, latent against a
          # 5 s probe period), and 12-networkpolicy.yaml refuses a newborn pod for
          # 0.2-1.0 s while k3s programs its address into the allow-set.
          #
          # None of the three can be closed from here, because the thing that is too
          # young is the pod this workflow has not created yet. They are closed by the
          # wait-for-postgres initContainer in 30-migrate-job.yaml and 20-app.yaml,
          # which retries inside the pod and therefore keeps one address. This gate
          # stays because it is still the right answer to "did Postgres start at all",
          # and it fails loudly (300 s) when the answer is no.
          kubectl -n tappa rollout status statefulset/tappa-postgres --timeout=300s

      - name: Migrate (its own step, its own role, before any new binary serves)
        env:
          SHORT: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          # 🔴 A BARE `kubectl logs job/...` CANNOT SHOW THE initContainer, AND THAT
          # IS EXACTLY THE LOG THIS ROUND MADE LOAD-BEARING. `kubectl logs` defaults
          # to the FIRST ORDINARY container and never selects an init container --
          # measured on this cluster against an unrelated pod that has one:
          #   $ kubectl -n argocd logs argocd-dex-server-... --tail=1
          #   Defaulted container "dex-server" out of: dex-server, copyutil (init)
          # In the NEW failure mode this round introduced, wait-for-postgres exits 1
          # after 120 s and the `goose` container is therefore NEVER CREATED, so
          # `kubectl logs job/tappa-migrate` returns a PodInitializing BadRequest --
          # which the trailing `|| true` then swallows. The Actions log would keep
          # only "the migration Job failed" and drop the one line that says WHICH
          # thing broke ("the NAME ... DOES NOT RESOLVE" vs "the NAME RESOLVES to").
          # Asking for each container by name is the only spelling that shows both.
          migrate_logs() {
            for c in wait-for-postgres goose; do
              echo "--- container: $c ---"
              kubectl -n tappa logs job/tappa-migrate -c "$c" --tail=200 2>&1 || true
            done
          }
          # A Job's pod template is immutable, so the previous one is removed rather
          # than applied over. --wait makes the delete synchronous.
          kubectl -n tappa delete job tappa-migrate --ignore-not-found --wait=true
          sed "s|:deploy-placeholder|:sha-$SHORT|g" deploy/k8s/30-migrate-job.yaml | kubectl apply -f -
          # ⚠️ `kubectl wait --for=condition=complete` BLOCKS UNTIL TIMEOUT WHEN THE
          # JOB FAILS — it waits for a condition that will never arrive, so a broken
          # migration would cost the full ten minutes and then report a timeout
          # rather than the failure. Polling both outcomes reports the real one.
          deadline=$(( $(date +%s) + 600 ))
          while :; do
            ok=$(kubectl -n tappa get job tappa-migrate -o jsonpath='{.status.succeeded}' 2>/dev/null || true)
            bad=$(kubectl -n tappa get job tappa-migrate -o jsonpath='{.status.failed}' 2>/dev/null || true)
            [ "${ok:-0}" -ge 1 ] 2>/dev/null && { echo "migration complete"; break; }
            if [ "${bad:-0}" -ge 3 ] 2>/dev/null; then
              echo "::error::the migration Job failed; the deployment is NOT rolled out"
              migrate_logs   # both containers; see the function above for why -c is mandatory
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::the migration Job did not finish within 600 s"
              migrate_logs   # both containers; see the function above for why -c is mandatory
              exit 1
            fi
            sleep 5
          done
          migrate_logs   # both containers; see the function above for why -c is mandatory

      - name: Roll out the server
        env:
          SHORT: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          sed "s|:deploy-placeholder|:sha-$SHORT|g" deploy/k8s/20-app.yaml | kubectl apply -f -
          kubectl apply -f deploy/k8s/40-ingress.yaml
          # maxUnavailable is 0, so the old pod keeps serving until the new one has
          # passed /readyz — i.e. until it has proved it can reach the database.
          kubectl -n tappa rollout status deployment/tappa --timeout=300s

      - name: Gate — the running server must not be connected as the migration role
        # internal/config only refuses DATABASE_URL == DATABASE_MIGRATE_URL. An owner
        # DSN typed into DATABASE_URL alone passes every check the product has, and
        # voids RLS entirely. pg_stat_activity is where that becomes visible.
        run: scripts/verify-deployment.sh db-role tappa

      - name: Report what is running
        if: always()
        run: |
          kubectl -n tappa get pods,svc,ingress -o wide || true
          # The build-identity line cmd/tappa writes before anything else. `-c tappa`
          # is explicit for the same reason the migration step names its containers:
          # this Deployment now has an initContainer, so a bare `kubectl logs` prints
          # a "Defaulted container ... out of: tappa, wait-for-postgres (init)" notice
          # and, if the pod is still IN that init container, fails outright.
          kubectl -n tappa logs deployment/tappa -c tappa --tail=5 || true
          # ...and when it IS still in init, that is the log that says why. This runs
          # `if: always()`, so it is also what an operator sees after a failed deploy.
          kubectl -n tappa logs deployment/tappa -c wait-for-postgres --tail=20 || true
