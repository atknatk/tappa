# Tappa — build, push and deploy (M8-02).
#
# 🔴 THIS RUNS ONLY AFTER `ci` HAS GONE GREEN ON main, AND workflow_run WAS CHOSEN
# OVER A JOB INSIDE ci.yml FOR A SECURITY REASON, NOT A STYLISTIC ONE.
#
# The two candidates were measured against each other:
#
#   (a) `deploy` as a job in ci.yml with `needs: check`. Strongest possible
#       ordering — same run, same SHA, cannot start unless check succeeded. But
#       ci.yml is `on: push` for EVERY branch and `on: pull_request`. The workflow
#       file holding a kubeconfig and packages:write would then be the same file
#       that any branch push evaluates, guarded only by an `if:` on the ref. An `if:`
#       is one edit away from not being there.
#
#   (b) `on: workflow_run`. GitHub always runs the DEFAULT BRANCH's copy of a
#       workflow_run workflow, regardless of which commit triggered it. A pull
#       request therefore cannot modify this file and have its modification run —
#       the credentials below are unreachable from any branch but main. And ci.yml
#       is not touched at all, so the gate everything else depends on carries none
#       of this risk. CHOSEN.
#
# ⚠️ THE COST OF (b), STATED: workflow_run's default checkout is the default
# branch's HEAD, NOT the commit that was tested. That is the classic footgun and
# every step below pins github.event.workflow_run.head_sha explicitly.
name: deploy

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  # Manual re-deploy of whatever is on main, for a rollback or a cluster-side fix.
  workflow_dispatch:

# Never cancel a deploy: cancel-in-progress would be able to kill the workflow
# between `goose up` finishing and the new image rolling out, leaving a schema ahead
# of the binary that serves it.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    # workflow_run fires on failure too; only a green ci may deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_IMAGE: ghcr.io/atknatk/tappa
      MIGRATE_IMAGE: ghcr.io/atknatk/tappa-migrate
      # The cluster is k3s v1.35.4 (measured). kubectl's supported skew is one minor
      # either way; pinning to the server's own minor removes the question.
      KUBECTL_VERSION: v1.35.4
      KUBECTL_SHA256: b529430df69a688fd61b64ad2299edb5fd71cb58be2a4779dba624c7d3510efd

    steps:
      - name: Resolve the commit to deploy
        id: sha
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sha="${{ github.sha }}"
          else
            sha="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "full=$sha"           >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:12}"   >> "$GITHUB_OUTPUT"
          echo "deploying $sha"

      # ⚠️ PINNED BY TAG, NOT BY COMMIT SHA — a decision, stated rather than left to
      # be noticed. A moving major tag means the action's code can change under this
      # workflow, and this workflow holds a kubeconfig. It is kept because ci.yml
      # already states the repository's rule (Q25(b)): first-party actions only,
      # pinned by major tag. Two consequences follow, and the second is why the
      # inconsistency with KUBECTL_SHA256 below is not an oversight: `checkout` is
      # published by GitHub itself and runs on GitHub's own runner, whereas kubectl
      # is a third-party download over the network, where a sha256 is the only thing
      # standing between a swapped binary and the cluster. Different threat, different
      # treatment. Changing this to a sha is a repo-wide decision (ci.yml pins the
      # same way), not one this file should make on its own.
      - name: Checkout that exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.full }}
          # 🔴 .git MUST SURVIVE INTO THE DOCKER CONTEXT. Go's -buildvcs stamps
          # vcs.revision/vcs.modified from it inside the builder, internal/buildinfo
          # reads them back, and cmd/tappa logs one line naming the running commit
          # before it dials the database. A build with no .git loses that silently —
          # no error, no warning, and a deployment that cannot say what it is running.
          # actions/checkout leaves a CLEAN tree, so vcs.modified comes out false;
          # verified in this task with a clean-clone control build.
          fetch-depth: 1
          # 🔴 persist-credentials: false IS NOT COSMETIC HERE. With the default,
          # actions/checkout writes the job's token into .git/config as an
          # http.extraheader — and .git is deliberately part of the docker build
          # context (above), so that token would be copied into a build-stage layer.
          # The final image is `scratch` and carries only two files, so it would not
          # be published; but a credential that reaches a layer at all is a
          # credential in a place nobody is auditing (CLAUDE.md §4.7).
          persist-credentials: false

      # Only first-party actions are used in this repository (ci.yml states the rule
      # and the reason: Q25(b)). Everything below is the plain CLI that ubuntu-latest
      # already ships, so no docker/login-action, no docker/build-push-action and no
      # third-party kubectl installer appears here.
      # 🔴 B8: scripts/verify-image.sh RUNS `go version -m`, AND UNTIL THIS STEP THAT
      # WAS AN UNDECLARED DEPENDENCY ON WHATEVER GO THE RUNNER IMAGE HAPPENED TO SHIP.
      # The failure mode was fail-closed (no go → the gate errors → no push), so it was
      # never going to ship a bad artifact; but "works because the runner image happens
      # to include it" is exactly the kind of unstated assumption this repository keeps
      # paying for. Pinned to the version the Dockerfile builds with, and setup-go is
      # first-party like every other action here (ci.yml, Q25(b)).
      - name: Set up Go (verify-image.sh reads buildinfo with it)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: false

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build both images
        env:
          SHORT: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          # The two targets share the `build` stage, so the second build is a cache
          # hit on everything expensive (measured locally: 3 min 58 s for the app,
          # then 8 s for the migrator).
          docker build --target app \
            -t "$APP_IMAGE:sha-$SHORT" -t "$APP_IMAGE:main" .
          docker build --target migrate \
            -t "$MIGRATE_IMAGE:sha-$SHORT" -t "$MIGRATE_IMAGE:main" .

      - name: Prove the artifact identifies itself before it is pushed
        env:
          SHORT: ${{ steps.sha.outputs.short }}
          FULL: ${{ steps.sha.outputs.full }}
        # 🔴 THE GATE LIVES IN scripts/verify-image.sh, NOT HERE, AND THAT MOVE IS
        # ITSELF A FINDING'S FIX. The first version of this step was inline shell and
        # parsed `go version -m` with awk on the wrong field; it produced two empty
        # variables, compared them against the deploy sha, and therefore FAILED EVERY
        # RUN — before `Push`, so nothing could be deployed at all. A security audit
        # measured it. The deeper problem is that a gate which only exists inside a
        # workflow cannot be pointed at a known-good and a known-bad image by the
        # person writing it; the script can, and this task's report shows all three
        # runs (clean+correct → pass, clean+wrong-sha → fire, dirty → fire).
        run: scripts/verify-image.sh "$APP_IMAGE:sha-$SHORT" "$FULL"

      - name: Prove the MIGRATION image carries this commit's migrations
        env:
          SHORT: ${{ steps.sha.outputs.short }}
        # 🔴 THE OTHER ARTIFACT, WHICH SHIPPED UNGATED UNTIL NOW (audit B7) — and it is
        # the more dangerous of the two: the server cannot touch the schema, this image
        # runs DDL as tappa_owner, the bootstrap SUPERUSER that bypasses RLS. It cannot
        # be checked by buildinfo (goose is built from its own module and stamps goose's
        # revision), so the gate checks the PAYLOAD: the migrations inside it must be
        # byte-identical to db/migrations at this commit.
        run: scripts/verify-image.sh --migrate "$MIGRATE_IMAGE:sha-$SHORT"

      - name: Push
        env:
          SHORT: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          docker push "$APP_IMAGE:sha-$SHORT"
          docker push "$APP_IMAGE:main"
          docker push "$MIGRATE_IMAGE:sha-$SHORT"
          docker push "$MIGRATE_IMAGE:main"

      - name: Install kubectl (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum -c -
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Write kubeconfig
        run: |
          set -euo pipefail
          # 🔴 THE SECRET IS NAMED KUBE_CONFIG AND IT IS BASE64. A raw YAML value
          # survives GitHub's secret store fine, but `printf` of a multi-line secret
          # is where trailing-newline and CRLF problems live; base64 has neither.
          # Create it with:
          #   base64 -w0 ~/.kube/config | gh secret set KUBE_CONFIG --repo atknatk/tappa
          # ⚠️ Scope it. A full cluster-admin kubeconfig in a CI secret is a
          # cluster-admin credential for anyone who can push to main. See
          # deploy/README.md step 4 for the ServiceAccount this deploy actually needs.
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context

      # 🔴 B6: THIS RUNS BEFORE ANYTHING IS APPLIED, AND THE MOVE IS THE POINT.
      # It used to run AFTER the rollout, with no rollback — so a proxied hostname
      # would take LIVE TAP TRAFFIC before the gate fired, and every one of those taps
      # would be judged against a Cloudflare edge address and written into an
      # IMMUTABLE transactions row claiming "network proof of place" it does not have
      # (§4.3 forbids correcting it; backlog T40 is the same defect from the other
      # side). A gate that only reports after the harm is a report, not a gate.
      #
      # It can run this early because it depends on DNS and the shared ingress
      # controller, both of which exist before this deploy touches anything. On a
      # genuinely first deploy the hostname does not resolve yet and the check says so
      # and passes; every other curl failure is now an error rather than a shrug (B5).
      - name: Preflight — the hostname must NOT be proxied by Cloudflare
        run: scripts/verify-deployment.sh cloudflare tappa.everva.com.tr

      # 🔴 THE APPLICATION SECRET STAYS THE OPERATOR'S — THIS GATE DOES NOT MOVE.
      # tappa-secrets holds TAPPA_TAG_KEK, the session HMAC key and both DSNs. CI
      # creating those would mean a value that wraps every wall plaque's AES key
      # (§4.7) passes through a workflow log's blast radius and through whoever can
      # push to main. It is created out of band, once, and this step only proves it
      # is there before anything tries to mount it.
      #
      # ⚠️ THE ghcr BRANCH USED TO BE CHECKED HERE TOO AND WAS MOVED OUT — deliberately,
      # and the line the two fall on either side of is WHOSE IDENTITY THE CREDENTIAL IS.
      # tappa-secrets is the PRODUCT's secrets: only the operator can know them.
      # secret/ghcr is a REGISTRY credential for images this very workflow just
      # pushed, i.e. CI's own identity — and requiring a human to mint a PAT so that
      # CI can read back what CI itself wrote is a step that exists only because
      # nobody wrote the next one. The next step writes it.
      - name: Preflight — the application Secret is the operator's and must already exist
        run: |
          set -euo pipefail
          kubectl apply -f deploy/k8s/00-namespace.yaml
          if ! kubectl -n tappa get secret tappa-secrets >/dev/null 2>&1; then
            echo "::error::secret/tappa-secrets is missing. It is created out of band and never by CI — see deploy/examples/externalsecret.example.yaml (recommended) or deploy/examples/secret.example.yaml."
            exit 1
          fi

      # 🔴 CI WRITES ITS OWN PULL CREDENTIAL, AND THE REASON IT CAN IS NARROW AND
      # WORTH STATING: GITHUB_TOKEN carries `packages: write` (declared at the top of
      # this file, which implies read), and a package pushed to GHCR by a workflow is
      # linked to the pushing repository, so that repository's own token may pull it
      # back. Both images were pushed by this job, minutes ago, with this token.
      #
      # ⚠️ THIS IS NOT A PERMANENT FIX AND MUST NOT BE READ AS ONE. GITHUB_TOKEN IS
      # REVOKED WHEN THE JOB ENDS. It works because of a second fact, not because the
      # token lives on: the pull happens seconds later, inside the same job's rollout,
      # and both manifests are `imagePullPolicy: IfNotPresent` against an IMMUTABLE
      # `sha-<12hex>` tag — so once the single node has the layers, every later restart
      # is served from the node and needs no credential at all.
      #
      # 🔴 WHERE IT BREAKS, STATED RATHER THAN DISCOVERED AT 04:00: if the node loses
      # the image (kubelet image GC under disk pressure, `crictl rmi`, a node rebuild)
      # AFTER the deploy job finished, the kubelet retries the pull with a dead token
      # and the pod does not start — ImagePullBackOff, on a product whose 04:00 shift
      # cannot load the tap page at all while the server is down. The durable fixes are
      # a long-lived read:packages PAT or making the packages public, and BOTH ARE THE
      # USER'S TO DO (GitHub exposes no API for the second — measured: PATCH
      # /user/packages/container/tappa → 404, no such endpoint). deploy/README.md
      # step 3 carries both, and the limit is written down in its accepted-limits list.
      #
      # The username is not what authenticates: measured 2026-08-15,
      # `docker login ghcr.io -u definitely-not-a-real-user-9x7q` with a valid token
      # returned "Login Succeeded". github.actor is used anyway, for one reason — the
      # `Log in to GHCR` step above already uses it and pushed both images with it in
      # run 31908808548, so this credential is spelled exactly like the one already
      # proven against this registry.
      - name: Write the GHCR pull credential (CI's own identity, refreshed every deploy)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # create|apply rather than plain create: idempotent, so a re-deploy refreshes
          # the token in place instead of failing with AlreadyExists.
          kubectl -n tappa create secret docker-registry ghcr \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USER" \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
          # Report the SHAPE and never the value: .dockerconfigjson holds a live token,
          # so this prints the type and the key NAMES only.
          echo "secret/ghcr type=$(kubectl -n tappa get secret ghcr -o jsonpath='{.type}')"
          echo "secret/ghcr keys=$(kubectl -n tappa get secret ghcr -o go-template='{{range $k, $v := .data}}{{$k}} {{end}}')"

      # 🔴 BACKLOG T43, AND ITS SHAPE CHANGED WHEN IT WAS MEASURED (2026-08-16).
      #
      # WHAT T43 SAID: a pod created before the Secret above is refreshed sits in
      # ImagePullBackOff forever. That is real and was lived through — 4 min 39 s on
      # 2026-08-15, cured only by a hand-typed `kubectl delete pod`. What the backlog
      # got wrong is the CAUSE, so it also got the scope wrong. Ordering is not the
      # problem: the Secret is already written above, before anything is applied.
      #
      # WHAT IS ACTUALLY GOING ON: this node's kubelet runs
      # imagePullCredentialsVerificationPolicy=NeverVerifyPreloadedImages (KEP-2535,
      # default from 1.35). A private image the kubelet pulled WITH a credential is
      # usable only by a pod presenting a credential already recorded against it;
      # to anyone else the image counts as absent even with imagePullPolicy:
      # IfNotPresent. Measured three ways on this node against the tag the live pod
      # was running: no secret -> 401; a secret it had never used -> 401;
      # imagePullPolicy Never -> "not present". Control: a PUBLIC image with
      # imagePullPolicy Never started straight from the node's cache. So the node's
      # cache is not the safety net 20-app.yaml used to claim it was, and a pod can
      # need a live credential at any restart — not only on a first pull.
      #
      # WHAT THIS STEP DOES ABOUT IT, AND WHAT IT DELIBERATELY DOES NOT. Once a pod
      # has failed a pull the kubelet's retry interval grows without bound, so it
      # will not notice the fresh credential written above for minutes. Recreating
      # the pod resets that and the replacement pulls immediately with the new
      # Secret. It only ever deletes pods the kubelet has REPORTED as stuck pulling
      # (ImagePullBackOff / ErrImagePull); a Running pod is never touched, so this
      # cannot interrupt the shift that is currently tapping. It is not a fix for the
      # underlying limit: deploy/README.md's accepted limit
      # "[GHCR çekme kimliği ömürlü]" stays open until the packages are public or a
      # read:packages PAT replaces this token. (The key is kept on ONE line on
      # purpose — a reference split across a wrap is a reference nothing can check.)
      - name: Recover pods stuck on a stale pull credential (backlog T43)
        run: |
          set -euo pipefail
          # 🔴 initContainerStatuses IS SCANNED TOO, AND LEAVING IT OUT WAS A REAL
          # BUG IN THE FIRST DRAFT OF THIS STEP. Both pod specs in deploy/k8s now
          # carry a wait-for-postgres initContainer that pulls postgres:17-alpine, so
          # a pod can be wedged on an image pull WITHOUT ever populating
          # containerStatuses — the main container has not been created yet. A
          # selector that reads only containerStatuses would walk straight past
          # exactly the pods this step exists to rescue.
          # 🔴 THE TEMPLATE EMITS ONE NAME PER LINE AND THIS PIPELINE CONTAINS NO
          # `grep`, AND THAT IS THE WHOLE POINT — NOT A STYLE CHOICE.
          #
          # The first version of this step piped through `grep -v '^$'`. On a HEALTHY
          # cluster the selector matches nothing, kubectl writes ZERO bytes, grep
          # selects no line and therefore EXITS 1 — that is grep doing its job, not an
          # error. Under `set -o pipefail` that 1 becomes the pipeline's status, the
          # assignment inherits it, and `set -e` kills the step. Measured with the
          # step body extracted verbatim and run the way GitHub Actions runs it
          # (`bash -e`, no `shell:` override anywhere in this file): STEP-EXIT=1 with
          # no output at all. The `if [ -z "$stuck" ]` branch below was UNREACHABLE
          # and its "nothing to recover" line could never print.
          #
          # 🔴 AND IT WOULD HAVE FAILED EVERY HEALTHY DEPLOY, DESTRUCTIVELY, because
          # of WHERE it sits: the GHCR Secret is overwritten with a fresh token in the
          # step above, and everything that applies manifests comes BELOW. A red step
          # here means the cluster keeps yesterday's workload while its recorded pull
          # credential has already been replaced — precisely the state that makes a
          # restart unrecoverable under the kubelet's credential verification (see
          # 20-app.yaml). It would have delivered nothing and lowered the running
          # product's restart-resilience on every attempt.
          #
          # `|| true` would also have worked and was rejected: it would silence a
          # genuine grep failure just as happily as the empty case. Removing the
          # command that cannot distinguish "no matches" from "broke" is the fix.
          # `sort -u` on empty input exits 0, and so does `tr`. Verified both ways.
          sel='{{range .items}}{{$n := .metadata.name}}{{range .status.initContainerStatuses}}{{if .state.waiting}}{{if or (eq .state.waiting.reason "ImagePullBackOff") (eq .state.waiting.reason "ErrImagePull")}}{{$n}}{{"\n"}}{{end}}{{end}}{{end}}{{range .status.containerStatuses}}{{if .state.waiting}}{{if or (eq .state.waiting.reason "ImagePullBackOff") (eq .state.waiting.reason "ErrImagePull")}}{{$n}}{{"\n"}}{{end}}{{end}}{{end}}{{end}}'
          # A pod stuck on BOTH would be named twice; delete tolerates that, but
          # de-duplicating keeps the log honest about how many pods were touched.
          stuck=$(kubectl -n tappa get pod -o go-template="$sel" | sort -u | tr '\n' ' ')
          if [ -z "$stuck" ]; then
            echo "no pod is stuck pulling; nothing to recover"
          else
            echo "recreating pods stuck on a stale pull credential: $stuck"
            # --ignore-not-found because a pod can vanish between the `get` above and
            # this line -- the Job's own ttlSecondsAfterFinished collector, or a
            # controller replacing it. Without it, delete exits 1 on NotFound, `set -e`
            # kills the step, and the deploy dies for the most BENIGN reason there is:
            # the pod we wanted to rescue is already gone. That matters because of
            # WHERE this step sits -- after secret/ghcr has been overwritten with a new
            # token and before anything is applied -- so a benign failure here leaves
            # the cluster in exactly the "new token, old workload" state this file
            # spends so many lines describing. The same flag is already used 68 lines
            # below on `delete job tappa-migrate`; this line simply did not get it.
            kubectl -n tappa delete pod $stuck --ignore-not-found --wait=false
          fi

      - name: Apply configuration and database
        run: |
          set -euo pipefail
          kubectl apply -f deploy/k8s/05-config.yaml
          # 🔴 THE INIT ConfigMap IS BUILT FROM THE REPOSITORY'S OWN FILE, so there
          # is exactly ONE definition of the role split anywhere. A hand-written
          # production copy of 01-roles.sql would be a second spelling of the rules
          # that make RLS mean anything (NOBYPASSRLS, NOSUPERUSER, which tables
          # tappa_resolver may see) — and drift between them is invisible until a
          # tenant reads another tenant's rows.
          kubectl -n tappa create configmap tappa-db-init \
            --from-file=01-roles.sql=scripts/db-init/01-roles.sql \
            --from-file=02-app-password.sh=deploy/k8s/postgres-init/02-app-password.sh \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f deploy/k8s/10-postgres.yaml
          kubectl apply -f deploy/k8s/12-networkpolicy.yaml
          # WHAT THIS GATE MEASURES: the StatefulSet has a ready replica, i.e. the
          # kubelet's exec probe (`pg_isready` over the UNIX SOCKET, no -h) answered.
          #
          # 🔴 WHAT IT DOES NOT MEASURE, MEASURED 2026-08-16 ON A FRESH VOLUME:
          # that anything can REACH the database over the network. On that run
          # Postgres opened 0.0.0.0:5432 at 08:50:35.2, the kubelet marked the pod
          # ready at 08:50:38, this command returned at 08:50:39 — and the headless
          # Service's DNS record did not exist until 08:50:42. A Job created the
          # instant this returns can fail to RESOLVE tappa-postgres for about three
          # seconds. There are two more windows it cannot see: the entrypoint's
          # init-script phase runs a temporary server with listen_addresses='' so the
          # exec probe can go green while TCP is shut (0.22 s here, latent against a
          # 5 s probe period), and 12-networkpolicy.yaml refuses a newborn pod for
          # 0.2-1.0 s while k3s programs its address into the allow-set.
          #
          # None of the three can be closed from here, because the thing that is too
          # young is the pod this workflow has not created yet. They are closed by the
          # wait-for-postgres initContainer in 30-migrate-job.yaml and 20-app.yaml,
          # which retries inside the pod and therefore keeps one address. This gate
          # stays because it is still the right answer to "did Postgres start at all",
          # and it fails loudly (300 s) when the answer is no.
          kubectl -n tappa rollout status statefulset/tappa-postgres --timeout=300s

      - name: Migrate (its own step, its own role, before any new binary serves)
        env:
          SHORT: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          # 🔴 A BARE `kubectl logs job/...` CANNOT SHOW THE initContainer, AND THAT
          # IS EXACTLY THE LOG THIS ROUND MADE LOAD-BEARING. `kubectl logs` defaults
          # to the FIRST ORDINARY container and never selects an init container --
          # measured on this cluster against an unrelated pod that has one:
          #   $ kubectl -n argocd logs argocd-dex-server-... --tail=1
          #   Defaulted container "dex-server" out of: dex-server, copyutil (init)
          # In the NEW failure mode this round introduced, wait-for-postgres exits 1
          # after 120 s and the `goose` container is therefore NEVER CREATED, so
          # `kubectl logs job/tappa-migrate` returns a PodInitializing BadRequest --
          # which the trailing `|| true` then swallows. The Actions log would keep
          # only "the migration Job failed" and drop the one line that says WHICH
          # thing broke ("the NAME ... DOES NOT RESOLVE" vs "the NAME RESOLVES to").
          # Asking for each container by name is the only spelling that shows both.
          migrate_logs() {
            for c in wait-for-postgres goose; do
              echo "--- container: $c ---"
              kubectl -n tappa logs job/tappa-migrate -c "$c" --tail=200 2>&1 || true
            done
          }
          # A Job's pod template is immutable, so the previous one is removed rather
          # than applied over. --wait makes the delete synchronous.
          kubectl -n tappa delete job tappa-migrate --ignore-not-found --wait=true
          sed "s|:deploy-placeholder|:sha-$SHORT|g" deploy/k8s/30-migrate-job.yaml | kubectl apply -f -
          # ⚠️ `kubectl wait --for=condition=complete` BLOCKS UNTIL TIMEOUT WHEN THE
          # JOB FAILS — it waits for a condition that will never arrive, so a broken
          # migration would cost the full ten minutes and then report a timeout
          # rather than the failure. Polling both outcomes reports the real one.
          deadline=$(( $(date +%s) + 600 ))
          while :; do
            ok=$(kubectl -n tappa get job tappa-migrate -o jsonpath='{.status.succeeded}' 2>/dev/null || true)
            bad=$(kubectl -n tappa get job tappa-migrate -o jsonpath='{.status.failed}' 2>/dev/null || true)
            [ "${ok:-0}" -ge 1 ] 2>/dev/null && { echo "migration complete"; break; }
            if [ "${bad:-0}" -ge 3 ] 2>/dev/null; then
              echo "::error::the migration Job failed; the deployment is NOT rolled out"
              migrate_logs   # both containers; see the function above for why -c is mandatory
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::the migration Job did not finish within 600 s"
              migrate_logs   # both containers; see the function above for why -c is mandatory
              exit 1
            fi
            sleep 5
          done
          migrate_logs   # both containers; see the function above for why -c is mandatory

      - name: Roll out the server
        env:
          SHORT: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          sed "s|:deploy-placeholder|:sha-$SHORT|g" deploy/k8s/20-app.yaml | kubectl apply -f -
          kubectl apply -f deploy/k8s/40-ingress.yaml
          # maxUnavailable is 0, so the old pod keeps serving until the new one has
          # passed /readyz — i.e. until it has proved it can reach the database.
          kubectl -n tappa rollout status deployment/tappa --timeout=300s

      - name: Gate — the running server must not be connected as the migration role
        # internal/config only refuses DATABASE_URL == DATABASE_MIGRATE_URL. An owner
        # DSN typed into DATABASE_URL alone passes every check the product has, and
        # voids RLS entirely. pg_stat_activity is where that becomes visible.
        run: scripts/verify-deployment.sh db-role tappa

      - name: Report what is running
        if: always()
        run: |
          kubectl -n tappa get pods,svc,ingress -o wide || true
          # The build-identity line cmd/tappa writes before anything else. `-c tappa`
          # is explicit for the same reason the migration step names its containers:
          # this Deployment now has an initContainer, so a bare `kubectl logs` prints
          # a "Defaulted container ... out of: tappa, wait-for-postgres (init)" notice
          # and, if the pod is still IN that init container, fails outright.
          kubectl -n tappa logs deployment/tappa -c tappa --tail=5 || true
          # ...and when it IS still in init, that is the log that says why. This runs
          # `if: always()`, so it is also what an operator sees after a failed deploy.
          kubectl -n tappa logs deployment/tappa -c wait-for-postgres --tail=20 || true
