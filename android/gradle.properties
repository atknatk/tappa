# Memory is tight on the build machine (task brief): cap the daemon and keep the
# build single-threaded. Do not run the Go test suite while this builds.
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=false
org.gradle.configuration-cache=false

# No AndroidX at runtime, so no android.useAndroidX; the platform classes suffice.
android.nonTransitiveRClass=true
